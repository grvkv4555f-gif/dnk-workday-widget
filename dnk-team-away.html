<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNK · Team Away</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-family:Manrope,system-ui,sans-serif;color:#242438;background:transparent;font-size:13px}*{box-sizing:border-box}body{margin:0;padding:8px}.app{max-width:1020px;margin:auto;border:1px solid #ffffffa6;border-radius:24px;padding:22px;background:linear-gradient(130deg,#ffffffed,#f9f8ffed);box-shadow:0 15px 50px #322b6b13;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:10px;letter-spacing:2px;color:#8c83b2;font-weight:800}.heading{font-size:24px;letter-spacing:-1px;font-weight:800;margin:4px 0}.sub{color:#88859a;font-size:11px}.btn{border:1px solid #e9e6f1;background:#fff;color:#403b56;border-radius:12px;padding:10px 13px;font:700 12px Manrope;cursor:pointer}.btn.primary{background:#27223c;color:#fff;border-color:#27223c}.btn:hover{filter:brightness(.96)}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#fff;border:1px solid #eeebf6;border-radius:15px;padding:12px 14px}.stat strong{font-size:23px;display:block}.stat small{color:#9792a5;font-size:10px}.stat:nth-child(2){background:#f1edff}.stat:nth-child(3){background:#fff4ed}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:17px 0}.month{font-size:16px;font-weight:800}.filter{padding:10px;border:1px solid #e9e6f1;border-radius:11px;background:white;font:600 11px Manrope;max-width:185px}.calendar{border:1px solid #e9e6f1;border-radius:16px;background:white;overflow:hidden}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week>div{text-align:center;padding:12px 0;font-size:10px;color:#a09aaf;font-weight:800;border-bottom:1px solid #f1eff6}.day{min-height:82px;border-right:1px solid #f2f0f7;border-bottom:1px solid #f2f0f7;padding:7px;cursor:pointer;position:relative;min-width:0}.day:nth-child(7n){border-right:0}.day.other{background:#fbfaff;color:#c9c6d2}.day.today .number{background:#2d2941;color:#fff}.number{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;font-size:11px;font-weight:800}.chips{display:flex;flex-direction:column;gap:3px;margin-top:5px}.chip{border-radius:5px;padding:3px 5px;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#49356f;background:#e9e0ff}.chip.vacation{background:#e8e0ff;color:#6245a0}.chip.dayoff{background:#dcf5ed;color:#26795c}.chip.out{background:#fff0d5;color:#976417}.chip.sick{background:#ffe0e8;color:#a34661}.chip.otherType{background:#e9edf5;color:#5c6986}.more{font-size:9px;color:#8b8798}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;color:#7c778b;font-size:10px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.status{margin-top:14px;font-size:11px;color:#817c90;min-height:15px}.status.error{color:#bf385a}.overlay{position:fixed;inset:0;background:#18152675;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.overlay.show{display:flex}.modal{background:#fff;border-radius:20px;padding:22px;width:min(430px,100%);box-shadow:0 20px 70px #0002}.modal h2{margin:0 0 14px;font-size:19px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:11px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #e4e0ec;border-radius:10px;padding:10px;font:500 12px Manrope;background:#fff;color:#29243b}.field textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.items{max-height:300px;overflow:auto}.entry{border:1px solid #eeeaf5;border-radius:12px;padding:10px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}.entry small{color:#928d9e;display:block;margin-top:4px}.danger{color:#bc4360}.empty{color:#8f8a9a;padding:12px 0}.notice{background:#fff3db;border:1px solid #f4e2ba;border-radius:10px;padding:9px;font-size:11px;color:#7d5e27;margin-top:10px}@media(max-width:600px){body{padding:3px}.app{padding:13px;border-radius:16px}.heading{font-size:20px}.stats{gap:5px;margin:14px 0}.stat{padding:9px}.stat strong{font-size:18px}.day{min-height:66px;padding:3px}.number{width:20px;height:20px;font-size:10px}.chip{font-size:8px;padding:2px 3px}.week>div{padding:9px 0}.two{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">DNK AGENCY / PEOPLE</div><div class="heading">Team Away <span aria-hidden="true">✳</span></div><div class="sub">Спільний календар відпусток і відсутностей команди</div></div><div class="tools"><button class="btn" id="refresh">↻ Оновити</button><button class="btn primary" id="add">＋ Додати відсутність</button></div></header><section class="stats"><div class="stat"><strong id="total">—</strong><small>Записів цього місяця</small></div><div class="stat"><strong id="away">—</strong><small>Відсутні сьогодні</small></div><div class="stat"><strong id="upcoming">—</strong><small>Майбутніх відсутностей</small></div></section><div class="bar"><div class="tools"><button class="btn" id="prev" aria-label="Попередній місяць">‹</button><span class="month" id="month"></span><button class="btn" id="next" aria-label="Наступний місяць">›</button><button class="btn" id="current">Сьогодні</button></div><select class="filter" id="person"><option value="">Уся команда</option></select></div><section class="calendar"><div class="week"><div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>НД</div></div><div class="days" id="days"></div></section><div class="legend"><span><i class="dot" style="background:#a88be4"></i>Відпустка</span><span><i class="dot" style="background:#79cba8"></i>Вихідний</span><span><i class="dot" style="background:#f2c174"></i>Відлучення</span><span><i class="dot" style="background:#ee9db3"></i>Лікарняний</span><span><i class="dot" style="background:#aebbd2"></i>Інше</span></div><div class="status" id="status" aria-live="polite"></div></main><div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle">Додати відсутність</h2><div id="formArea"><form id="form"><label class="field">Співробітник<select id="employee" required></select></label><label class="field">Тип відсутності<select id="type" required><option>Відпустка</option><option>Вихідний</option><option>Відлучення</option><option>Лікарняний</option><option>Інше</option></select></label><div class="two"><label class="field">Дата початку<input id="start" type="date" required></label><label class="field">Дата завершення<input id="end" type="date" required></label></div><div class="two"><label class="field">Час початку (необов'язково)<input id="startTime" type="time"></label><label class="field">Час завершення<input id="endTime" type="time"></label></div><label class="field">Коментар<textarea id="comment" rows="2" maxlength="500" placeholder="Необов'язково"></textarea></label><div class="actions"><button type="button" class="btn close">Скасувати</button><button class="btn primary" id="save" type="submit">Зберегти</button></div></form></div><div id="listArea" hidden><div class="items" id="entries"></div><div class="actions"><button class="btn close">Закрити</button><button class="btn primary" id="addFromDay">＋ Додати</button></div></div><div class="notice" id="modalError" hidden></div></div></div><script>
'use strict';
// Спільна база Cloudflare D1 через Worker. Змінювати адресу потрібно лише тут.
const API='https://dnk-team-away.mpg597hhyh.workers.dev';
const PEOPLE=['Аня Таргетолог','Аня проджект','Надя','Свєта','Даша','Єгор','Кіріл'];
const TYPES={'Відпустка':'vacation','Вихідний':'dayoff','Відлучення':'out','Лікарняний':'sick','Інше':'otherType'};
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=dateKey(new Date());let view=new Date();view.setDate(1);let records=[];let selectedDay=today;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=r=>({id:r.id,employee:r.employee??r.employee_name??'',type:r.type??'',start_date:r.start_date??'',end_date:r.end_date??'',start_time:r.start_time??'',end_time:r.end_time??'',comment:r.comment??''});
const visible=r=>!$('person').value||r.employee===$('person').value;
const overlaps=(r,d)=>r.start_date<=d&&r.end_date>=d;
const setStatus=(msg,error=false)=>{$('status').textContent=msg;$('status').className='status'+(error?' error':'');};
async function request(path,options={}){const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data;try{data=await response.json()}catch{throw Error('Сервер повернув некоректну відповідь')};if(!response.ok||data?.ok===false)throw Error(data?.error||`Помилка HTTP ${response.status}`);return data;}
async function load(){setStatus('Синхронізація з командною базою…');try{const data=await request('/api/absences');const list=Array.isArray(data)?data:Array.isArray(data.absences)?data.absences:Array.isArray(data.records)?data.records:Array.isArray(data.data)?data.data:null;if(!list)throw Error('Невідомий формат відповіді API');records=list.map(normal);setStatus('● Дані синхронізовано з Cloudflare D1');render()}catch(e){setStatus('Не вдалося завантажити записи: '+e.message,true);render()}}
function render(){const year=view.getFullYear(),month=view.getMonth();$('month').textContent=new Intl.DateTimeFormat('uk-UA',{month:'long',year:'numeric'}).format(view);const first=new Date(year,month,1);const offset=(first.getDay()+6)%7;const count=new Date(year,month+1,0).getDate();const cells=Math.ceil((offset+count)/7)*7;const subset=records.filter(visible);$('days').innerHTML='';for(let i=0;i<cells;i++){const d=new Date(year,month,i-offset+1),key=dateKey(d),items=subset.filter(r=>overlaps(r,key));const el=document.createElement('div');el.className='day'+(d.getMonth()!==month?' other':'')+(key===today?' today':'');el.innerHTML=`<span class="number">${d.getDate()}</span><div class="chips">${items.slice(0,3).map(r=>`<div class="chip ${TYPES[r.type]||'otherType'}" title="${escapeHtml(r.employee+' · '+r.type)}">${escapeHtml(r.employee)}</div>`).join('')}${items.length>3?`<span class="more">+${items.length-3} ще</span>`:''}</div>`;el.addEventListener('click',()=>openDay(key));$('days').append(el)}const firstKey=dateKey(first),lastKey=dateKey(new Date(year,month+1,0));$('total').textContent=subset.filter(r=>r.start_date<=lastKey&&r.end_date>=firstKey).length;$('away').textContent=new Set(subset.filter(r=>overlaps(r,today)).map(r=>r.employee)).size;$('upcoming').textContent=subset.filter(r=>r.start_date>today).length}
function showModal(){ $('overlay').classList.add('show');$('modalError').hidden=true}function closeModal(){$('overlay').classList.remove('show')}
function openForm(day=today){selectedDay=day;$('modalTitle').textContent='Нова відсутність';$('formArea').hidden=false;$('listArea').hidden=true;$('form').reset();$('start').value=day;$('end').value=day;showModal()}
function openDay(day){selectedDay=day;$('modalTitle').textContent=new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long',year:'numeric'}).format(new Date(day+'T12:00:00'));$('formArea').hidden=true;$('listArea').hidden=false;const items=records.filter(r=>visible(r)&&overlaps(r,day));$('entries').innerHTML=items.length?items.map(r=>`<div class="entry"><div><strong>${escapeHtml(r.employee)}</strong> · ${escapeHtml(r.type)}<small>${escapeHtml(r.start_date)} — ${escapeHtml(r.end_date)}${r.start_time?' · '+escapeHtml(r.start_time):''}${r.comment?' · '+escapeHtml(r.comment):''}</small></div><button class="btn danger" data-delete="${escapeHtml(r.id)}" aria-label="Видалити запис">✕</button></div>`).join(''):'<div class="empty">На цю дату відсутностей немає.</div>';showModal()}
$('entries').addEventListener('click',async e=>{const btn=e.target.closest('[data-delete]');if(!btn)return;if(!confirm('Видалити цей запис для всієї команди?'))return;btn.disabled=true;try{await request('/api/absences/'+encodeURIComponent(btn.dataset.delete),{method:'DELETE'});await load();openDay(selectedDay)}catch(err){$('modalError').textContent=err.message;$('modalError').hidden=false;btn.disabled=false}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const body={employee:$('employee').value,type:$('type').value,start_date:$('start').value,end_date:$('end').value,start_time:$('startTime').value||null,end_time:$('endTime').value||null,comment:$('comment').value.trim()||null};if(body.end_date<body.start_date){$('modalError').textContent='Дата завершення не може бути раніше початку';$('modalError').hidden=false;return}const save=$('save');save.disabled=true;save.textContent='Зберігаємо…';try{await request('/api/absences',{method:'POST',body:JSON.stringify(body)});closeModal();await load()}catch(err){$('modalError').textContent='Не вдалося зберегти: '+err.message;$('modalError').hidden=false}finally{save.disabled=false;save.textContent='Зберегти'}});
for(const name of PEOPLE){for(const id of ['person','employee']){const opt=document.createElement('option');opt.value=name;opt.textContent=name;$(id).append(opt)}}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('current').onclick=()=>{view=new Date();view.setDate(1);render()};$('person').onchange=render;$('refresh').onclick=load;$('add').onclick=()=>openForm(today);$('addFromDay').onclick=()=>openForm(selectedDay);document.querySelectorAll('.close').forEach(el=>el.onclick=closeModal);$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});load();
</script></body></html>
