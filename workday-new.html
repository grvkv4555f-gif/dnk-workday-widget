<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

:root {
  --green: #00f500;
  --text: #111;
  --muted: #7b7b7b;
  --bg: #f7f7f5;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(circle at 15% 15%, rgba(0,245,0,.08), transparent 28%),
    radial-gradient(circle at 90% 80%, rgba(0,245,0,.05), transparent 30%),
    var(--bg);

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--text);
}

.app {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 22px;
}

/* HEADER */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .8px;
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 16px rgba(0,245,0,.55);
}

/* GLASS */

.glass {
  background: rgba(255,255,255,.64);
  border: 1px solid rgba(255,255,255,.9);

  box-shadow:
    0 18px 45px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,1);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

/* CARD */

.card {
  border-radius: 28px;
  padding: 28px;
}

.eyebrow {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1.2px;
  color: #8b8b8b;
  margin-bottom: 10px;
}

.big-time {
  font-size: 38px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -1.3px;
  margin-bottom: 9px;
}

.description {
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}

/* PROGRESS */

.progress-section {
  margin-top: 27px;

  background: rgba(255,255,255,.72);
  border-radius: 21px;
  padding: 19px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    0 8px 25px rgba(0,0,0,.045);
}

.times {
  display: flex;
  justify-content: space-between;
  align-items: center;

  font-size: 10px;
  font-weight: 900;
  color: #888;

  margin-bottom: 11px;
}

.progress-track {
  width: 100%;
  height: 10px;

  border-radius: 999px;
  background: rgba(0,0,0,.07);

  overflow: hidden;

  box-shadow:
    inset 0 2px 5px rgba(0,0,0,.06);
}

.progress-bar {
  width: 0%;
  height: 100%;

  border-radius: 999px;

  background:
    linear-gradient(
      90deg,
      #00d900,
      var(--green)
    );

  box-shadow:
    0 0 15px rgba(0,245,0,.45);

  transition: width .7s ease;
}

.progress-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-top: 12px;
}

.percent {
  font-size: 11px;
  font-weight: 900;
}

.work-status {
  display: flex;
  align-items: center;
  gap: 6px;

  font-size: 9px;
  font-weight: 900;
  letter-spacing: .6px;

  color: #8a8a8a;
}

.mini-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;

  background: var(--green);
  box-shadow: 0 0 10px rgba(0,245,0,.45);
}

/* PHRASE */

.phrase {
  margin-top: 14px;

  padding: 16px 18px;

  border-radius: 18px;

  background: rgba(255,255,255,.55);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 7px 20px rgba(0,0,0,.035);

  text-align: center;

  font-size: 11px;
  line-height: 1.4;

  font-weight: 900;
  letter-spacing: .35px;
}

/* MOBILE */

@media(max-width:520px) {

  .app {
    padding: 14px;
  }

  .card {
    padding: 21px;
  }

  .big-time {
    font-size: 32px;
  }

  .progress-section {
    padding: 16px;
  }
}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="title">
      ⏱ РОБОЧИЙ ДЕНЬ
    </div>

    <div class="status-dot"></div>

  </div>


  <div class="card glass">

    <div class="eyebrow" id="eyebrow">
      ДО КІНЦЯ РОБОЧОГО ДНЯ
    </div>

    <div class="big-time" id="timeLeft">
      —
    </div>

    <div class="description" id="description">
      Робочий день 09:00–18:00
    </div>


    <div class="progress-section">

      <div class="times">
        <span>09:00</span>
        <span>18:00</span>
      </div>

      <div class="progress-track">
        <div
          class="progress-bar"
          id="progressBar">
        </div>
      </div>


      <div class="progress-bottom">

        <div
          class="percent"
          id="percent">
          0% дня пройшло
        </div>

        <div class="work-status">
          <span class="mini-dot"></span>
          <span id="status">DNK</span>
        </div>

      </div>

    </div>


    <div
      class="phrase"
      id="phrase">
      КАВА Є? ТОДІ ПОЇХАЛИ ☕️
    </div>

  </div>

</div>


<script>

/*
  Робочий день:
  09:00 — 18:00
*/

const START_HOUR = 9;
const END_HOUR = 18;

function pad(number) {
  return String(number).padStart(2, "0");
}

function formatRemaining(milliseconds) {

  const totalMinutes =
    Math.max(
      0,
      Math.ceil(milliseconds / 60000)
    );

  const hours =
    Math.floor(totalMinutes / 60);

  const minutes =
    totalMinutes % 60;

  if (hours === 0) {
    return `${minutes} хв`;
  }

  if (minutes === 0) {
    return `${hours} год`;
  }

  return `${hours} год ${minutes} хв`;
}


function updateWorkday() {

  const now = new Date();

  const day = now.getDay();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes() +
    now.getSeconds() / 60;

  const startMinutes =
    START_HOUR * 60;

  const endMinutes =
    END_HOUR * 60;


  const timeLeft =
    document.getElementById("timeLeft");

  const eyebrow =
    document.getElementById("eyebrow");

  const description =
    document.getElementById("description");

  const progressBar =
    document.getElementById("progressBar");

  const percent =
    document.getElementById("percent");

  const phrase =
    document.getElementById("phrase");

  const status =
    document.getElementById("status");


  /* =====================
     ВИХІДНІ
  ===================== */

  if (day === 0 || day === 6) {

    eyebrow.textContent =
      "СЬОГОДНІ";

    timeLeft.textContent =
      "ВИХІДНИЙ";

    description.textContent =
      "Робочий день почекає до понеділка.";

    progressBar.style.width =
      "0%";

    percent.textContent =
      "0% роботи сьогодні";

    status.textContent =
      "OFFLINE";

    phrase.textContent =
      "ТИ ЧОГО ТУТ? ВИХІДНИЙ 😂";

    return;
  }


  /* =====================
     ДО 09:00
  ===================== */

  if (currentMinutes < startMinutes) {

    const start = new Date();

    start.setHours(
      START_HOUR,
      0,
      0,
      0
    );

    eyebrow.textContent =
      "ДО ПОЧАТКУ РОБОЧОГО ДНЯ";

    timeLeft.textContent =
      formatRemaining(
        start - now
      );

    description.textContent =
      "Стартуємо о 09:00.";

    progressBar.style.width =
      "0%";

    percent.textContent =
      "День ще не почався";

    status.textContent =
      "ЩЕ НЕ ПРАЦЮЄМО";

    phrase.textContent =
      "МОЖНА ЩЕ НЕ ВІДКРИВАТИ NOTION 😌";

    return;
  }


  /* =====================
     ПІСЛЯ 18:00
  ===================== */

  if (currentMinutes >= endMinutes) {

    eyebrow.textContent =
      "НА СЬОГОДНІ";

    timeLeft.textContent =
      "ВСЕ 💚";

    description.textContent =
      "Робочий день завершено.";

    progressBar.style.width =
      "100%";

    percent.textContent =
      "100% дня пройшло";

    status.textContent =
      "DONE";

    phrase.textContent =
      "ВСЕ. ЗАКРИВАЙ NOTION 💚";

    return;
  }


  /* =====================
     РОБОЧИЙ ЧАС
  ===================== */

  const totalWorkMinutes =
    endMinutes - startMinutes;

  const workedMinutes =
    currentMinutes - startMinutes;

  const progress =
    Math.min(
      100,
      Math.max(
        0,
        (workedMinutes / totalWorkMinutes) * 100
      )
    );


  const end = new Date();

  end.setHours(
    END_HOUR,
    0,
    0,
    0
  );


  eyebrow.textContent =
    "ДО КІНЦЯ РОБОЧОГО ДНЯ";

  timeLeft.textContent =
    formatRemaining(
      end - now
    );

  description.textContent =
    "Робочий день 09:00–18:00";

  progressBar.style.width =
    progress + "%";

  percent.textContent =
    Math.floor(progress) +
    "% дня вже пройшло";

  status.textContent =
    "ПРАЦЮЄМО";


  /* =====================
     ФРАЗИ ПО ЧАСУ
  ===================== */

  const hour =
    now.getHours();


  if (hour >= 9 && hour < 11) {

    phrase.textContent =
      "КАВА Є? ТОДІ ПОЇХАЛИ ☕️";

  }

  else if (hour >= 11 && hour < 13) {

    phrase.textContent =
      "РОБОЧИЙ РЕЖИМ: ON ⚡️";

  }

  else if (hour >= 13 && hour < 15) {

    phrase.textContent =
      "ПОЛОВИНА ДНЯ ДЕСЬ ТУТ 👀";

  }

  else if (hour >= 15 && hour < 17) {

    phrase.textContent =
      "ФІНАЛЬНИЙ РИВОК";

  }

  else {

    phrase.textContent =
      "НЕ ПОЧИНАЙ НОВУ ЗАДАЧУ 😂";

  }

}


/* Оновлюємо щосекунди */

updateWorkday();

setInterval(
  updateWorkday,
  1000
);

</script>

</body>
</html>
