<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNK — Контент-план</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #00f500;
      --black: #111111;
      --gray: #8f8f8f;
      --bg: #f7f7f5;
      --glass: rgba(255,255,255,.72);
    }

    body {
      min-height: 100vh;
      padding: 26px 18px 40px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--black);

      background:
        radial-gradient(
          circle at 12% 18%,
          rgba(0,245,0,.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 82%,
          rgba(0,245,0,.045),
          transparent 25%
        ),
        var(--bg);
    }

    .app {
      width: min(100%, 810px);
      margin: 0 auto;
    }

    /* HEADER */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding: 0 5px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px rgba(0,245,0,.55);
      flex: 0 0 auto;
    }

    .sync {
      font-size: 11px;
      font-weight: 900;
      color: #999;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    /* PROJECT NAV */

    .project-scroll {
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 20px;
      padding-bottom: 3px;
    }

    .project-scroll::-webkit-scrollbar {
      display: none;
    }

    .projects {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .project-btn {
      border: 1px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.67);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      padding: 12px 18px;
      border-radius: 999px;

      font-family: inherit;
      font-size: 12px;
      line-height: 1;
      font-weight: 800;
      color: #777;

      cursor: pointer;
      white-space: nowrap;

      box-shadow:
        0 8px 22px rgba(0,0,0,.045),
        inset 0 1px 0 rgba(255,255,255,.95);

      transition: .2s ease;
    }

    .project-btn:hover {
      transform: translateY(-1px);
      color: #111;
    }

    .project-btn.active {
      color: white;
      background: #111;
      border-color: #111;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }

    /* MAIN GLASS */

    .main-card {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 30px;

      padding: 30px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 24px 55px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    /* PROJECT INFO */

    .project-head {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .logo-box {
      width: 90px;
      height: 90px;
      flex: 0 0 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px;

      border-radius: 24px;
      background: rgba(255,255,255,.72);

      box-shadow:
        0 12px 30px rgba(0,0,0,.06),
        inset 0 1px 0 white;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .eyebrow {
      color: #999;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .project-name {
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 9px;
    }

    .period {
      color: #777;
      font-size: 14px;
      font-weight: 650;
    }

    /* COUNTER */

    .counter-card {
      padding: 28px;
      border-radius: 26px;
      background: rgba(255,255,255,.64);

      box-shadow:
        0 12px 34px rgba(0,0,0,.055),
        inset 0 1px 0 white;

      margin-bottom: 18px;
    }

    .counter-label {
      color: #999;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .counter-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 18px;
    }

    .number-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .current {
      font-size: 72px;
      line-height: .95;
      font-weight: 950;
      letter-spacing: -4px;
    }

    .total {
      color: #aaa;
      font-size: 36px;
      font-weight: 900;
    }

    .percent {
      font-size: 13px;
      font-weight: 850;
      color: #858585;
      padding-bottom: 7px;
    }

    .bar {
      width: 100%;
      height: 13px;
      border-radius: 999px;
      overflow: hidden;

      background: rgba(0,0,0,.075);

      box-shadow:
        inset 0 2px 4px rgba(0,0,0,.07),
        0 1px 0 rgba(255,255,255,.8);
    }

    .fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      box-shadow: 0 0 18px rgba(0,245,0,.35);
      transition: width .35s ease;
    }

    .bar-info {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 11px;

      font-size: 11px;
      font-weight: 850;
      color: #8d8d8d;
    }

    /* BUTTONS */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    button.action {
      height: 64px;
      border: none;
      border-radius: 21px;

      font-family: inherit;
      font-size: 16px;
      font-weight: 900;

      cursor: pointer;
      transition: .18s ease;
    }

    button.action:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .minus {
      color: #777;
      background: rgba(255,255,255,.65);

      box-shadow:
        0 10px 28px rgba(0,0,0,.04),
        inset 0 1px 0 white;
    }

    .plus {
      color: white;
      background: #111;

      box-shadow:
        0 15px 32px rgba(0,0,0,.14);
    }

    button.action:disabled {
      opacity: .28;
      cursor: default;
    }

    /* FOOT */

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      margin-top: 18px;

      color: #999;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);

      background: rgba(17,17,17,.94);
      color: white;

      padding: 13px 20px;
      border-radius: 999px;

      font-size: 13px;
      font-weight: 750;

      opacity: 0;
      pointer-events: none;

      transition: .25s ease;

      box-shadow: 0 15px 35px rgba(0,0,0,.18);

      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* MOBILE */

    @media (max-width: 620px) {
      body {
        padding: 18px 12px 30px;
      }

      .topbar {
        margin-bottom: 18px;
      }

      .sync {
        display: none;
      }

      .main-card {
        padding: 20px;
        border-radius: 26px;
      }

      .project-head {
        gap: 14px;
      }

      .logo-box {
        width: 72px;
        height: 72px;
        flex-basis: 72px;
        border-radius: 20px;
      }

      .project-name {
        font-size: 27px;
      }

      .counter-card {
        padding: 22px;
      }

      .current {
        font-size: 60px;
      }

      .total {
        font-size: 29px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .footer {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="topbar">
      <div class="brand">
        КОНТЕНТ-ПЛАН
        <span class="dot"></span>
      </div>

      <div class="sync" id="syncText">
        СИНХРОНІЗАЦІЯ...
      </div>
    </div>

    <div class="project-scroll">
      <div class="projects" id="projectButtons"></div>
    </div>

    <div class="main-card">

      <div class="project-head">

        <div class="logo-box">
          <img id="projectLogo" src="" alt="">
        </div>

        <div>
          <div class="eyebrow">КІЛЬКІСТЬ ДОПИСІВ</div>
          <div class="project-name" id="projectName"></div>
          <div class="period" id="projectPeriod"></div>
        </div>

      </div>

      <div class="counter-card">

        <div class="counter-label">
          ОПУБЛІКОВАНО
        </div>

        <div class="counter-row">

          <div class="number-wrap">
            <div class="current" id="currentCount">0</div>
            <div class="total" id="totalCount">/15</div>
          </div>

          <div class="percent" id="percentText">
            0% виконано
          </div>

        </div>

        <div class="bar">
          <div class="fill" id="progressFill"></div>
        </div>

        <div class="bar-info">
          <span id="remainingText">Залишилось 15</span>
          <span id="statusText">ПОЧИНАЄМО</span>
        </div>

      </div>

      <div class="actions">
        <button
          class="action minus"
          id="minusBtn"
          onclick="changeCount(-1)"
        >
          − 1 ДОПИС
        </button>

        <button
          class="action plus"
          id="plusBtn"
          onclick="changeCount(1)"
        >
          + 1 ДОПИС
        </button>
      </div>

      <div class="footer">
        <span id="reportDate"></span>
        <span id="periodBottom"></span>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>


  <script type="module">

    /* =========================
       FIREBASE
    ========================= */

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      runTransaction
    }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyArvN4PkhrXrLwehOE9mrzO_IDKmpYoGu4",
      authDomain: "anya-80fd6.firebaseapp.com",
      projectId: "anya-80fd6",
      storageBucket: "anya-80fd6.firebasestorage.app",
      messagingSenderId: "457102538038",
      appId: "1:457102538038:web:2665c576a846cc9b7c2f97",
      measurementId: "G-228WKNGZEE"
    };


    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);


    /* =========================
       PROJECTS
    ========================= */

    const projects = {

      amtex: {
        name: "AMTEX",
        logo: "amtex-logo.svg",
        total: 15,
        start: "18.09.2026",
        end: "17.10.2026"
      },

      dnk: {
        name: "DNK AGENCY",
        logo: "dnk-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      redefine: {
        name: "REDEFINE",
        logo: "redefine-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      orising: {
        name: "ORISING",
        logo: "orising-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      epilax: {
        name: "EPILAX",
        logo: "epilax-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      "duso-consulting": {
        name: "DUSO CONSULTING",
        logo: "duso-consulting-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      icoone: {
        name: "ICOONE",
        logo: "icoone-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      endymed: {
        name: "ENDYMED",
        logo: "endymed-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      duso: {
        name: "DUSO",
        logo: "duso-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      azura: {
        name: "AZURA",
        logo: "azura-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      "carp-pro": {
        name: "CARP PRO",
        logo: "carp-pro-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      },

      aerodrom: {
        name: "AERODROM",
        logo: "aerodrom-logo.png",
        total: 15,
        start: "01.10.2026",
        end: "31.10.2026"
      }

    };


    /* =========================
       ELEMENTS
    ========================= */

    const projectButtons =
      document.getElementById("projectButtons");

    const projectLogo =
      document.getElementById("projectLogo");

    const projectName =
      document.getElementById("projectName");

    const projectPeriod =
      document.getElementById("projectPeriod");

    const currentCount =
      document.getElementById("currentCount");

    const totalCount =
      document.getElementById("totalCount");

    const percentText =
      document.getElementById("percentText");

    const progressFill =
      document.getElementById("progressFill");

    const remainingText =
      document.getElementById("remainingText");

    const statusText =
      document.getElementById("statusText");

    const minusBtn =
      document.getElementById("minusBtn");

    const plusBtn =
      document.getElementById("plusBtn");

    const reportDate =
      document.getElementById("reportDate");

    const periodBottom =
      document.getElementById("periodBottom");

    const syncText =
      document.getElementById("syncText");


    /* =========================
       READ PROJECT FROM URL
    ========================= */

    const params =
      new URLSearchParams(window.location.search);

    let activeProject =
      (params.get("project") || "amtex")
      .toLowerCase()
      .trim();


    if (!projects[activeProject]) {
      activeProject = "amtex";
    }


    let currentValue = 0;
    let unsubscribe = null;


    /* =========================
       BUTTONS
    ========================= */

    function createProjectButtons() {

      projectButtons.innerHTML = "";

      Object.entries(projects).forEach(([key, project]) => {

        const button =
          document.createElement("button");

        button.className =
          "project-btn";

        button.textContent =
          project.name;

        if (key === activeProject) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => {

          const url =
            new URL(window.location.href);

          url.searchParams.set(
            "project",
            key
          );

          window.location.href =
            url.toString();

        });

        projectButtons.appendChild(button);

      });

    }


    /* =========================
       PROJECT INFO
    ========================= */

    function renderProjectInfo() {

      const project =
        projects[activeProject];

      projectName.textContent =
        project.name;

      projectLogo.src =
        project.logo;

      projectLogo.alt =
        project.name;

      projectPeriod.textContent =
        `${project.start} — ${project.end}`;

      totalCount.textContent =
        `/${project.total}`;

      reportDate.textContent =
        `ЗВІТ: ${project.end}`;

      periodBottom.textContent =
        `ПЕРІОД ${project.start}`;

    }


    /* =========================
       COUNTER UI
    ========================= */

    function renderCounter(value) {

      const project =
        projects[activeProject];

      const safeValue =
        Math.max(
          0,
          Math.min(value, project.total)
        );

      currentValue = safeValue;

      const percentage =
        Math.round(
          (safeValue / project.total) * 100
        );

      const remaining =
        project.total - safeValue;


      currentCount.textContent =
        safeValue;

      percentText.textContent =
        `${percentage}% виконано`;

      progressFill.style.width =
        `${percentage}%`;

      remainingText.textContent =
        remaining === 0
          ? "Все опубліковано"
          : `Залишилось ${remaining}`;


      if (percentage === 0) {
        statusText.textContent =
          "ПОЧИНАЄМО";
      }

      else if (percentage < 35) {
        statusText.textContent =
          "ПОЇХАЛИ";
      }

      else if (percentage < 70) {
        statusText.textContent =
          "В ПРОЦЕСІ";
      }

      else if (percentage < 100) {
        statusText.textContent =
          "ЩЕ ТРОХИ";
      }

      else {
        statusText.textContent =
          "ГОТОВО ✓";
      }


      minusBtn.disabled =
        safeValue <= 0;

      plusBtn.disabled =
        safeValue >= project.total;

    }


    /* =========================
       FIRESTORE
    ========================= */

    function getProjectRef() {

      /*
        КОЖЕН ПРОЄКТ МАЄ
        СВІЙ ОКРЕМИЙ DOCUMENT:

        counters/amtex
        counters/epilax
        counters/orising
        counters/azura
        ...
      */

      return doc(
        db,
        "counters",
        activeProject
      );

    }


    async function connectProject() {

      syncText.textContent =
        "СИНХРОНІЗАЦІЯ...";

      if (unsubscribe) {
        unsubscribe();
      }

      const ref =
        getProjectRef();


      unsubscribe =
        onSnapshot(

          ref,

          async snapshot => {

            if (!snapshot.exists()) {

              await setDoc(
                ref,
                {
                  count: 0,
                  project: activeProject
                }
              );

              renderCounter(0);

            }

            else {

              const data =
                snapshot.data();

              renderCounter(
                Number(data.count) || 0
              );

            }

            syncText.textContent =
              "СИНХРОНІЗОВАНО";

          },

          error => {

            console.error(error);

            syncText.textContent =
              "ПОМИЛКА СИНХРОНІЗАЦІЇ";

            showToast(
              "Не вдалося підключитися до Firebase"
            );

          }

        );

    }


    /* =========================
       CHANGE COUNT
    ========================= */

    window.changeCount =
      async function(delta) {

        const project =
          projects[activeProject];

        const ref =
          getProjectRef();

        plusBtn.disabled = true;
        minusBtn.disabled = true;


        try {

          await runTransaction(
            db,
            async transaction => {

              const snapshot =
                await transaction.get(ref);

              let oldValue = 0;

              if (snapshot.exists()) {

                oldValue =
                  Number(
                    snapshot.data().count
                  ) || 0;

              }


              const newValue =
                Math.max(
                  0,
                  Math.min(
                    oldValue + delta,
                    project.total
                  )
                );


              transaction.set(
                ref,
                {
                  count: newValue,
                  project: activeProject
                },
                {
                  merge: true
                }
              );

            }
          );


          if (delta > 0) {

            showToast(
              `+1 допис · ${project.name}`
            );

          }

          else {

            showToast(
              `−1 допис · ${project.name}`
            );

          }

        }

        catch (error) {

          console.error(error);

          showToast(
            "Не вдалося зберегти зміну"
          );

          renderCounter(currentValue);

        }

      };


    /* =========================
       TOAST
    ========================= */

    let toastTimer;

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent =
        message;

      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 1800);

    }


    /* =========================
       START
    ========================= */

    createProjectButtons();

    renderProjectInfo();

    renderCounter(0);

    connectProject();

  </script>

</body>
</html>
