<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNK Content Plan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #00f500;
      --black: #111111;
      --gray: #8f8f8f;
      --light-gray: #e9e9e9;
      --bg: #f7f7f5;
      --glass: rgba(255, 255, 255, 0.72);
    }

    body {
      min-height: 100vh;
      padding: 28px 18px 45px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--black);

      background:
        radial-gradient(
          circle at 8% 18%,
          rgba(0, 245, 0, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 88% 80%,
          rgba(0, 245, 0, 0.055),
          transparent 25%
        ),
        var(--bg);
    }

    .app {
      width: min(100%, 850px);
      margin: 0 auto;
    }

    /* HEADER */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 26px;
      padding: 0 5px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 15px rgba(0, 245, 0, 0.5);
      flex-shrink: 0;
    }

    .sync {
      color: #999;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    /* PROJECT NAV */

    .project-nav-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .project-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 3px 3px 10px;
      scrollbar-width: none;
    }

    .project-nav::-webkit-scrollbar {
      display: none;
    }

    .project-btn {
      border: 1px solid rgba(255,255,255,.95);
      background: rgba(255,255,255,.68);
      box-shadow:
        0 8px 22px rgba(0,0,0,.045),
        inset 0 1px 0 rgba(255,255,255,.95);

      color: #7f7f7f;

      border-radius: 999px;
      padding: 12px 17px;

      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
      cursor: pointer;

      transition: .2s ease;
    }

    .project-btn:hover {
      transform: translateY(-1px);
      color: #111;
    }

    .project-btn.active {
      background: #111;
      color: white;
      border-color: #111;
      box-shadow: 0 10px 24px rgba(0,0,0,.16);
    }

    /* MAIN GLASS */

    .main-card {
      position: relative;
      overflow: hidden;

      padding: 30px;

      border-radius: 32px;
      border: 1px solid rgba(255,255,255,.92);

      background: var(--glass);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 22px 60px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.95);
    }

    .main-card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(0,245,0,.055);
      filter: blur(45px);
      left: -120px;
      top: -140px;
      pointer-events: none;
    }

    /* PROJECT HEADER */

    .project-header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .logo-box {
      width: 94px;
      height: 82px;
      flex: 0 0 94px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px;

      border-radius: 24px;

      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.95);

      box-shadow:
        0 12px 30px rgba(0,0,0,.055),
        inset 0 1px 0 white;
    }

    .logo-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .eyebrow {
      color: #969696;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .project-name {
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -1.2px;
      margin-bottom: 8px;
    }

    .period {
      color: #7f7f7f;
      font-size: 14px;
      font-weight: 650;
    }

    /* COUNTER CARD */

    .counter-card {
      position: relative;

      padding: 27px 28px 24px;
      border-radius: 28px;

      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.95);

      box-shadow:
        0 15px 38px rgba(0,0,0,.055),
        inset 0 1px 0 white;
    }

    .counter-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .counter-label {
      color: #909090;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .count {
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    #currentCount {
      font-size: clamp(60px, 11vw, 78px);
      font-weight: 950;
      letter-spacing: -4px;
    }

    .target {
      color: #999;
      font-size: 36px;
      font-weight: 850;
      margin-left: 8px;
    }

    .percent {
      color: #818181;
      font-size: 13px;
      font-weight: 800;
      padding-bottom: 10px;
      white-space: nowrap;
    }

    /* PROGRESS */

    .progress {
      width: 100%;
      height: 12px;
      margin-top: 23px;

      overflow: hidden;
      border-radius: 999px;

      background: rgba(0,0,0,.075);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.07);
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;
      background: var(--green);

      box-shadow:
        0 0 15px rgba(0,245,0,.30);

      transition: width .35s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      margin-top: 12px;

      color: #8a8a8a;
      font-size: 11px;
      font-weight: 850;
    }

    /* BUTTONS */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    button.action {
      height: 64px;
      border-radius: 22px;
      border: 0;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;
      transition: .18s ease;
    }

    button.action:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button.action:active:not(:disabled) {
      transform: scale(.99);
    }

    .minus {
      color: #777;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.9) !important;

      box-shadow:
        0 12px 30px rgba(0,0,0,.04),
        inset 0 1px 0 white;
    }

    .plus {
      background: #111;
      color: white;

      box-shadow: 0 14px 30px rgba(0,0,0,.14);
    }

    button.action:disabled {
      opacity: .30;
      cursor: not-allowed;
    }

    /* FOOTER */

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-top: 19px;
      padding: 0 3px;

      color: #999;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 20px);

      padding: 11px 17px;
      border-radius: 999px;

      color: #111;
      background: rgba(255,255,255,.88);

      border: 1px solid rgba(255,255,255,.95);
      box-shadow: 0 12px 35px rgba(0,0,0,.12);

      backdrop-filter: blur(18px);

      font-size: 12px;
      font-weight: 800;

      opacity: 0;
      pointer-events: none;

      transition: .25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px 30px;
      }

      .topbar {
        margin-bottom: 18px;
      }

      .main-card {
        padding: 20px;
        border-radius: 27px;
      }

      .project-header {
        gap: 14px;
      }

      .logo-box {
        width: 76px;
        height: 70px;
        flex-basis: 76px;
        border-radius: 20px;
      }

      .counter-card {
        padding: 22px 20px;
      }

      .counter-top {
        align-items: flex-end;
      }

      .target {
        font-size: 29px;
      }

      .actions {
        gap: 10px;
      }

      button.action {
        height: 58px;
      }

      .footer {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="topbar">
      <div class="brand">
        КОНТЕНТ-ПЛАН
        <span class="dot"></span>
      </div>

      <div class="sync" id="syncStatus">
        СИНХРОНІЗАЦІЯ...
      </div>
    </div>


    <div class="project-nav-wrap">
      <div class="project-nav" id="projectNav"></div>
    </div>


    <main class="main-card">

      <section class="project-header">

        <div class="logo-box">
          <img id="projectLogo" alt="">
        </div>

        <div>
          <div class="eyebrow">КІЛЬКІСТЬ ДОПИСІВ</div>

          <div class="project-name" id="projectName">
            —
          </div>

          <div class="period" id="periodText">
            —
          </div>
        </div>

      </section>


      <section class="counter-card">

        <div class="counter-top">

          <div>
            <div class="counter-label">ОПУБЛІКОВАНО</div>

            <div class="count">
              <span id="currentCount">0</span>
              <span class="target" id="targetCount">/15</span>
            </div>
          </div>

          <div class="percent" id="percentText">
            0% виконано
          </div>

        </div>


        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>


        <div class="progress-info">
          <span id="remainingText">Залишилось 15</span>
          <span id="statusText">ПОЧИНАЄМО</span>
        </div>

      </section>


      <section class="actions">

        <button
          class="action minus"
          id="minusButton"
          type="button"
        >
          − 1 ДОПИС
        </button>

        <button
          class="action plus"
          id="plusButton"
          type="button"
        >
          + 1 ДОПИС
        </button>

      </section>


      <footer class="footer">
        <span id="reportText">ЗВІТ: —</span>
        <span id="periodKeyText">ПЕРІОД —</span>
      </footer>

    </main>

  </div>


  <div class="toast" id="toast"></div>


  <script type="module">

    /* ============================
       FIREBASE
    ============================ */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      updateDoc,
      increment
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyArvN4PkhrXrLwehOE9mrzO_IDKmpYoGu4",
      authDomain: "anya-80fd6.firebaseapp.com",
      projectId: "anya-80fd6",
      storageBucket: "anya-80fd6.firebasestorage.app",
      messagingSenderId: "457102538038",
      appId: "1:457102538038:web:2665c576a846cc9b7c2f97",
      measurementId: "G-228WKNGZEE"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);



    /* ============================
       PROJECTS
    ============================ */

    const projects = {

      amtex: {
        name: "AMTEX",
        target: 15,
        startDay: 18,
        type: "rolling",
        logo: "amtex-logo.svg"
      },

      dnk: {
        name: "DNK AGENCY",
        target: 15,
        startDay: 5,
        type: "rolling",
        logo: "dnk-logo.png"
      },

      redefine: {
        name: "REDEFINE",
        target: 15,
        startDay: 1,
        type: "calendar",
        logo: "redefine-logo.png"
      },

      orising: {
        name: "ORISING",
        target: 15,
        startDay: 5,
        type: "rolling",
        logo: "orising-logo.png"
      },

      epilax: {
        name: "EPILAX",
        target: 12,
        startDay: 11,
        type: "rolling",
        logo: "epilax-logo.png"
      },

      "duso-consulting": {
        name: "DUSO CONSULTING",
        target: 8,
        startDay: 1,
        type: "calendar",
        logo: "duso-consulting-logo.png"
      },

      icoone: {
        name: "ICOONE",
        target: 10,
        startDay: 1,
        type: "calendar",
        logo: "icoone-logo.png"
      },

      endymed: {
        name: "ENDYMED",
        target: 10,
        startDay: 1,
        type: "calendar",
        logo: "endymed-logo.png"
      },

      duso: {
        name: "DUSO",
        target: 22,
        startDay: 1,
        type: "calendar",
        logo: "duso-logo.png"
      },

      "carp-pro": {
        name: "CARP PRO",
        target: 22,
        startDay: 1,
        type: "calendar",
        logo: "carp-pro-logo.png"
      },

      azura: {
        name: "AZURA",
        target: 22,
        startDay: 1,
        type: "calendar",
        logo: "azura-logo.png"
      },

      aerodrom: {
        name: "AERODROM",
        target: 22,
        startDay: 1,
        type: "calendar",
        logo: "aerodrom-logo.png"
      }

    };



    /* ============================
       HELPERS
    ============================ */

    function pad(value) {
      return String(value).padStart(2, "0");
    }


    function formatDate(date) {
      return `${pad(date.getDate())}.${pad(date.getMonth() + 1)}.${date.getFullYear()}`;
    }


    function firebaseDate(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }


    function lastDayOfMonth(year, month) {
      return new Date(year, month + 1, 0);
    }



    /* ============================
       PERIOD CALCULATION
    ============================ */

    function getPeriod(project, now = new Date()) {

      const year = now.getFullYear();
      const month = now.getMonth();
      const day = now.getDate();


      /* CALENDAR MONTH
         1 → last day
      */

      if (project.type === "calendar") {

        const start = new Date(year, month, 1);

        const end = lastDayOfMonth(year, month);

        return {
          start,
          end,
          reportDate: end
        };
      }


      /* ROLLING PERIOD
         Example:
         AMTEX 18 → 17
         DNK 5 → 4
         ORISING 5 → 4
         EPILAX 11 → 10
      */

      const startDay = project.startDay;

      let start;
      let end;


      if (day >= startDay) {

        start = new Date(
          year,
          month,
          startDay
        );

        end = new Date(
          year,
          month + 1,
          startDay - 1
        );

      } else {

        start = new Date(
          year,
          month - 1,
          startDay
        );

        end = new Date(
          year,
          month,
          startDay - 1
        );

      }


      return {
        start,
        end,
        reportDate: end
      };
    }



    /* ============================
       URL PROJECT
    ============================ */

    const params = new URLSearchParams(window.location.search);

    let currentProjectKey =
      (params.get("project") || "amtex")
      .trim()
      .toLowerCase();


    /* aliases so links are forgiving */

    const aliases = {
      "dnk-agency": "dnk",
      "dnkagency": "dnk",

      "duso_consulting": "duso-consulting",
      "dusoconsulting": "duso-consulting",

      "carppro": "carp-pro",
      "carp_pro": "carp-pro",

      "aerodrome": "aerodrom"
    };


    if (aliases[currentProjectKey]) {
      currentProjectKey = aliases[currentProjectKey];
    }


    if (!projects[currentProjectKey]) {
      currentProjectKey = "amtex";
    }



    /* ============================
       ELEMENTS
    ============================ */

    const projectNav =
      document.getElementById("projectNav");

    const projectLogo =
      document.getElementById("projectLogo");

    const projectName =
      document.getElementById("projectName");

    const periodText =
      document.getElementById("periodText");

    const currentCount =
      document.getElementById("currentCount");

    const targetCount =
      document.getElementById("targetCount");

    const percentText =
      document.getElementById("percentText");

    const progressFill =
      document.getElementById("progressFill");

    const remainingText =
      document.getElementById("remainingText");

    const statusText =
      document.getElementById("statusText");

    const reportText =
      document.getElementById("reportText");

    const periodKeyText =
      document.getElementById("periodKeyText");

    const minusButton =
      document.getElementById("minusButton");

    const plusButton =
      document.getElementById("plusButton");

    const syncStatus =
      document.getElementById("syncStatus");

    const toast =
      document.getElementById("toast");



    /* ============================
       NAVIGATION
    ============================ */

    function renderNavigation() {

      projectNav.innerHTML = "";

      Object.entries(projects).forEach(
        ([key, project]) => {

          const button =
            document.createElement("button");

          button.className =
            "project-btn" +
            (key === currentProjectKey
              ? " active"
              : "");

          button.textContent =
            project.name;

          button.addEventListener(
            "click",
            () => {

              const url =
                new URL(window.location.href);

              url.searchParams.set(
                "project",
                key
              );

              window.location.href =
                url.toString();

            }
          );

          projectNav.appendChild(button);

        }
      );


      requestAnimationFrame(() => {

        const active =
          projectNav.querySelector(".active");

        if (active) {
          active.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
          });
        }

      });

    }



    /* ============================
       PROJECT DATA
    ============================ */

    const project =
      projects[currentProjectKey];

    const period =
      getPeriod(project);

    const periodId =
      `${currentProjectKey}_${firebaseDate(period.start)}`;


    const counterRef =
      doc(
        db,
        "counters",
        periodId
      );



    /* ============================
       STATIC UI
    ============================ */

    function renderProject() {

      projectName.textContent =
        project.name;

      projectLogo.src =
        project.logo;

      projectLogo.alt =
        project.name;

      targetCount.textContent =
        `/${project.target}`;

      periodText.textContent =
        `${formatDate(period.start)} — ${formatDate(period.end)}`;

      reportText.textContent =
        `ЗВІТ: ${formatDate(period.reportDate)}`;

      periodKeyText.textContent =
        `ПЕРІОД ${firebaseDate(period.start)}`;

    }



    /* ============================
       COUNTER UI
    ============================ */

    function renderCount(count) {

      count =
        Math.max(
          0,
          Number(count) || 0
        );


      const target =
        project.target;


      const percent =
        Math.min(
          100,
          Math.round(
            (count / target) * 100
          )
        );


      const remaining =
        Math.max(
          target - count,
          0
        );


      currentCount.textContent =
        count;

      percentText.textContent =
        `${percent}% виконано`;

      progressFill.style.width =
        `${percent}%`;

      remainingText.textContent =
        remaining === 0
          ? "План виконано"
          : `Залишилось ${remaining}`;


      if (count === 0) {

        statusText.textContent =
          "ПОЧИНАЄМО";

      } else if (percent < 35) {

        statusText.textContent =
          "РОЗГАНЯЄМОСЬ";

      } else if (percent < 70) {

        statusText.textContent =
          "В ПРОЦЕСІ";

      } else if (percent < 100) {

        statusText.textContent =
          "ЩЕ ТРОХИ";

      } else {

        statusText.textContent =
          "ГОТОВО ✓";

      }


      minusButton.disabled =
        count <= 0;

    }



    /* ============================
       FIREBASE LIVE SYNC
    ============================ */

    let currentValue = 0;


    onSnapshot(

      counterRef,

      async snapshot => {

        syncStatus.textContent =
          "СИНХРОНІЗОВАНО";


        if (!snapshot.exists()) {

          await setDoc(
            counterRef,
            {
              project: currentProjectKey,
              projectName: project.name,
              count: 0,
              target: project.target,
              periodStart:
                firebaseDate(period.start),
              periodEnd:
                firebaseDate(period.end)
            }
          );

          currentValue = 0;
          renderCount(0);

          return;
        }


        const data =
          snapshot.data();

        currentValue =
          Number(data.count) || 0;

        renderCount(
          currentValue
        );

      },

      error => {

        console.error(error);

        syncStatus.textContent =
          "ПОМИЛКА СИНХРОНІЗАЦІЇ";

        showToast(
          "Не вдалося підключитися до лічильника"
        );

      }

    );



    /* ============================
       CHANGE COUNT
    ============================ */

    let changing = false;


    async function changeCount(amount) {

      if (changing) return;


      if (
        amount < 0 &&
        currentValue <= 0
      ) {
        return;
      }


      changing = true;

      plusButton.disabled = true;
      minusButton.disabled = true;


      try {

        await updateDoc(
          counterRef,
          {
            count: increment(amount)
          }
        );

      } catch (error) {

        console.error(error);

        showToast(
          "Не вдалося зберегти зміну"
        );

      } finally {

        changing = false;

        plusButton.disabled = false;

        minusButton.disabled =
          currentValue <= 0;

      }

    }



    plusButton.addEventListener(
      "click",
      () => changeCount(1)
    );


    minusButton.addEventListener(
      "click",
      () => changeCount(-1)
    );



    /* ============================
       TOAST
    ============================ */

    let toastTimer;


    function showToast(message) {

      clearTimeout(toastTimer);

      toast.textContent =
        message;

      toast.classList.add("show");

      toastTimer =
        setTimeout(
          () => {
            toast.classList.remove("show");
          },
          2200
        );

    }



    /* ============================
       START
    ============================ */

    renderNavigation();
    renderProject();
    renderCount(0);

  </script>

</body>
