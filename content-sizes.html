<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
}

.widget {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 22px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.title {
  font-size: 18px;
  font-weight: 900;
}

.dot {
  width: 11px;
  height: 11px;
  background: #00f500;
  border-radius: 50%;
  box-shadow: 0 0 14px rgba(0,245,0,.5);
}

.networks {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.network {
  border: 2px solid #111;
  background: #fff;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
}

.network.active {
  background: #00f500;
}

.formats {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.format {
  border: 2px solid #111;
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  text-align: left;
  font-weight: 800;
  cursor: pointer;
}

.format:hover,
.format.active {
  border-color: #00f500;
  box-shadow: inset 5px 0 0 #00f500;
}

.result {
  border: 2px solid #111;
  border-left: 8px solid #00f500;
  border-radius: 15px;
  padding: 20px;
  min-height: 150px;
}

.result-label {
  font-size: 11px;
  font-weight: 900;
  color: #777;
  margin-bottom: 7px;
}

.result-name {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 14px;
}

.size {
  font-size: 32px;
  font-weight: 900;
  color: #00d900;
}

.ratio {
  margin-top: 4px;
  font-size: 14px;
  font-weight: 800;
}

.note {
  margin-top: 14px;
  font-size: 13px;
  line-height: 1.45;
  color: #555;
}

@media(max-width:500px) {
  .widget { padding: 14px; }

  .networks {
    display: grid;
    grid-template-columns: repeat(2,1fr);
  }

  .network {
    width: 100%;
  }

  .formats {
    grid-template-columns: 1fr;
  }

  .size {
    font-size: 27px;
  }
}
</style>
</head>

<body>

  <div class="header">
    <div class="title">📐 DNK CONTENT SIZES</div>
    <div class="dot"></div>
  </div>

  <div class="formats" id="formats"></div>

    <div class="result-label">ОБЕРИ ФОРМАТ</div>

  }

};

const networkContainer = document.getElementById("networks");
const formatsContainer = document.getElementById("formats");
const result = document.getElementById("result");

let activeNetwork = "Instagram";

function renderNetworks() {

  networkContainer.innerHTML = "";

  Object.keys(data).forEach(network => {

    const button = document.createElement("button");

    button.className =
      "network" + (network === activeNetwork ? " active" : "");

    button.textContent = network;

    button.onclick = () => {
      activeNetwork = network;
      renderNetworks();
      renderFormats();
      resetResult();
    };

    networkContainer.appendChild(button);
  });
}

function renderFormats() {

  formatsContainer.innerHTML = "";

  data[activeNetwork].forEach((item,index) => {

    const button = document.createElement("button");

    button.className = "format";
    button.textContent = item.name;

    button.onclick = () => {

      document
        .querySelectorAll(".format")
        .forEach(x => x.classList.remove("active"));

      button.classList.add("active");

      showResult(item);
    };

    formatsContainer.appendChild(button);
  });
}

function showResult(item) {

  result.innerHTML = `
    <div class="result-label">РЕКОМЕНДОВАНИЙ РОЗМІР</div>
    <div class="result-name">${item.name}</div>
    <div class="size">${item.size}</div>
    <div class="ratio">Співвідношення: ${item.ratio}</div>
    <div class="note">${item.note}</div>
  `;
}

function resetResult() {

  result.innerHTML = `
    <div class="result-label">${activeNetwork.toUpperCase()}</div>
    <div class="result-name">Обери потрібний формат 👆</div>
  `;
}

renderNetworks();
renderFormats();
resetResult();

</script>

</body>
</html>
