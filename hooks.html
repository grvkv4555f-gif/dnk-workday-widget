<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

.widget {
  width: 100%;
  max-width: 760px;
  padding: 28px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #00F500;
  box-shadow: 0 0 14px rgba(0,245,0,.65);
}

.hook-box {
  min-height: 150px;
  border: 2px solid #111;
  border-radius: 16px;
  padding: 28px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.hook-box::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 7px;
  background: #00F500;
}

#hook {
  font-size: 26px;
  line-height: 1.25;
  font-weight: 800;
  color: #111;
}

button {
  width: 100%;
  margin-top: 14px;
  border: 0;
  border-radius: 14px;
  padding: 17px 20px;
  background: #00F500;
  color: #080808;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: transform .12s ease;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: scale(.98);
}

.counter {
  text-align: center;
  margin-top: 10px;
  color: #888;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="widget">

  <div class="top">
    <div class="title">🎯 DNK HOOK GENERATOR</div>
    <div class="dot"></div>
  </div>

  <div class="hook-box">
    <div id="hook">Натисни кнопку — дам тобі хук 👀</div>
  </div>

  <button onclick="generateHook()">
    ⚡ ДАТИ ІНШИЙ ХУК
  </button>

  <div class="counter" id="counter">
    База DNK
  </div>

</div>

<script>

const hooks = [
"Ви теж робите цю помилку, коли ___?",
"Ось чому у вас досі не виходить ___",
"3 помилки, через які ___",
"Як зрозуміти, що вам пора ___",
"Що буде, якщо ___?",
"Ви впевнені, що правильно ___?",
"Одна деталь, яка може повністю змінити ___",
"Перш ніж ___, перевірте це",
"Неочевидна причина, чому ___",
"Ось що варто знати перед тим, як ___",
"Чому ___ працює не так, як ви думаєте",
"Що я хотіла б знати перед тим, як ___",
"Найчастіше питання про ___ — відповідаємо",
"Як ___ без ___?",
"Що обрати: ___ чи ___?",
"5 речей, які варто знати про ___",
"Це може бути причиною, чому ___",
"Ось як виглядає ___ насправді",
"Ви могли цього не знати про ___",
"Чому всі говорять про ___?",
"Розбираємо ___ за 30 секунд",
"Як не помилитися при виборі ___",
"Що зміниться, якщо ви почнете ___",
"Одна помилка, яку ми бачимо постійно",
"Як зрозуміти, що ___ вам не підходить",
"Вам точно потрібен ___? Давайте розберемося",
"Що перевірити перед покупкою ___",
"Чому дешевше — не завжди вигідніше",
"Міф про ___, у який досі вірять",
"Що насправді впливає на ___",
"Від чого залежить ___?",
"Як виглядає правильний ___",
"Якщо ви плануєте ___ — збережіть це",
"Не робіть ___, поки не перевірите це",
"Що ми перевіряємо перед тим, як ___",
"Чому результат може відрізнятися навіть при однаковому ___",
"Ось де найчастіше помиляються з ___",
"Що врахувати, якщо ви вперше ___",
"Різниця між ___ і ___ простими словами",
"Ось що відбувається, коли ___",
"Чи справді ___ потрібно всім?",
"Коли ___ справді має сенс?",
"Що робити, якщо ___?",
"Ознаки того, що пора змінити ___",
"Чому після ___ ви отримуєте ___",
"З чого почати, якщо ви хочете ___",
"Що точно не варто робити після ___",
"Як ми підбираємо ___ під конкретну задачу",
"Покажемо ___ без красивих обіцянок",
"Відповідаємо на незручне питання про ___",
"Ви просили — показуємо ___",
"Зберігайте, щоб не шукати потім",
"Ось простий спосіб перевірити ___",
"Скільки насправді потрібно ___?",
"Чому два однакові ___ можуть давати різний результат?",
"Що приховується за ___?",
"Ось що більшість не враховує при ___",
"До і після: що змінилося насправді?",
"Розберімо ситуацію: ___",
"Один нюанс, про який часто забувають",
"Це нормально, якщо після ___ ви бачите ___?",
"Що краще зробити ДО ___",
"Як підготуватися до ___",
"Чому ми не радимо ___ у кожному випадку",
"Кому підійде ___, а кому — ні?",
"Як виглядає ___ через місяць?",
"Що запитати перед тим, як обрати ___",
"3 питання, які варто поставити перед ___",
"Ви б помітили цю помилку?",
"Давайте перевіримо, чи правильно ви ___",
"Ось чому ми завжди звертаємо увагу на ___",
"Що змінює одна маленька деталь у ___?",
"Результат починається ще до ___",
"Найпоширеніша помилка на старті ___",
"Як уникнути ___ ще до того, як це стало проблемою",
"Що робити одразу після ___",
"Чому ___ може не дати очікуваного результату",
"Що впливає на результат більше, ніж здається",
"Ви точно врахували це перед ___?",
"Коротко про те, що варто знати щодо ___"
];

let lastIndex = -1;

function generateHook() {

  let index;

  do {
    index = Math.floor(Math.random() * hooks.length);
  } while (index === lastIndex && hooks.length > 1);

  lastIndex = index;

  document.getElementById("hook").textContent = hooks[index];

  document.getElementById("counter").textContent =
    "Хук " + (index + 1) + " із " + hooks.length;
}

</script>

</body>
</html>
