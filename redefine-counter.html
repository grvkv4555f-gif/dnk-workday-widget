<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REDEFINE — Контент-план</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--green:#00f500;--black:#111;--bg:#f7f7f5;--glass:rgba(255,255,255,.72)}
html,body{width:100%;min-height:100%}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 10%,rgba(0,245,0,.09),transparent 35%),radial-gradient(circle at 95% 90%,rgba(0,245,0,.05),transparent 30%),var(--bg);color:var(--black);padding:16px}.widget{width:100%;max-width:720px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}.top-left{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:850;letter-spacing:2px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(0,245,0,.45)}.sync{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#a0a0a0}.card{background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:28px;padding:22px;box-shadow:0 18px 45px rgba(0,0,0,.07),inset 0 1px 0 #fff;backdrop-filter:blur(22px)}.project{display:flex;align-items:center;gap:16px;margin-bottom:18px}.logo-box{width:74px;height:74px;flex:0 0 74px;border-radius:21px;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;padding:11px;box-shadow:0 10px 28px rgba(0,0,0,.055),inset 0 1px 0 #fff}.logo-box img{width:100%;height:100%;object-fit:contain}.eyebrow,.counter-label{font-size:10px;font-weight:850;color:#999;letter-spacing:2px;margin-bottom:6px}h1{font-size:31px;line-height:1;font-weight:900;letter-spacing:-1px;margin-bottom:7px}.period{color:#777;font-size:13px;font-weight:700}.counter-card{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.92);border-radius:23px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.045),inset 0 1px 0 #fff}.counter-row{display:flex;justify-content:space-between;align-items:flex-end;gap:15px}.number-wrap{display:flex;align-items:flex-end;line-height:1}#count{font-size:58px;font-weight:900;letter-spacing:-4px}.target{font-size:30px;font-weight:850;color:#aaa;margin-left:8px;margin-bottom:5px}#percent{color:#858585;font-size:12px;font-weight:800;margin-bottom:8px;white-space:nowrap}.progress{width:100%;height:10px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden;margin-top:13px}#bar{width:0;height:100%;border-radius:inherit;background:var(--green);box-shadow:0 0 14px rgba(0,245,0,.35);transition:.35s}.progress-info{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:#8d8d8d;font-size:10px;font-weight:800}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}button{border:0;border-radius:19px;height:54px;font:850 14px inherit;cursor:pointer}button:active{transform:scale(.98)}#minus{background:rgba(255,255,255,.6);color:#aaa;box-shadow:0 10px 25px rgba(0,0,0,.035),inset 0 1px 0 #fff}#minus.active{color:#333}#plus{background:#111;color:#fff;box-shadow:0 12px 25px rgba(0,0,0,.12)}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:13px;padding:0 2px;color:#999;font-size:9px;font-weight:850;letter-spacing:1px}#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:11px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;z-index:999}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){body{padding:10px}.card{padding:17px;border-radius:24px}.logo-box{width:64px;height:64px;flex-basis:64px}h1{font-size:27px}#count{font-size:50px}.target{font-size:26px}.counter-card{padding:17px}button{height:50px}}
</style></head>
<body>
<div class="widget"><div class="top"><div class="top-left">КОНТЕНТ-ПЛАН <span class="dot"></span></div><div class="sync" id="syncText">СИНХРОНІЗАЦІЯ...</div></div>
<div class="card"><div class="project"><div class="logo-box"><img src="redefine-logo.png" alt="REDEFINE"></div><div><div class="eyebrow">КІЛЬКІСТЬ ДОПИСІВ</div><h1>REDEFINE</h1><div class="period" id="period"></div></div></div>
<div class="counter-card"><div class="counter-label">ОПУБЛІКОВАНО</div><div class="counter-row"><div class="number-wrap"><span id="count">0</span><span class="target">/15</span></div><div id="percent">0% виконано</div></div><div class="progress"><div id="bar"></div></div><div class="progress-info"><span id="remaining">Залишилось 15</span><span id="status">ПОЧИНАЄМО</span></div></div>
<div class="buttons"><button id="minus">− 1 ДОПИС</button><button id="plus">+ 1 ДОПИС</button></div><div class="footer"><span id="reportDate"></span><span id="periodStart"></span></div></div></div><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyArvN4PkhrXrLwehOE9mrzO_IDKmpYoGu4",authDomain:"anya-80fd6.firebaseapp.com",projectId:"anya-80fd6",storageBucket:"anya-80fd6.firebasestorage.app",messagingSenderId:"457102538038",appId:"1:457102538038:web:2665c576a846cc9b7c2f97",measurementId:"G-228WKNGZEE"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),PROJECT_ID="redefine",TARGET=15;
const countEl=document.getElementById("count"),percentEl=document.getElementById("percent"),barEl=document.getElementById("bar"),remainingEl=document.getElementById("remaining"),statusEl=document.getElementById("status"),minusBtn=document.getElementById("minus"),plusBtn=document.getElementById("plus"),periodEl=document.getElementById("period"),reportDateEl=document.getElementById("reportDate"),periodStartEl=document.getElementById("periodStart"),syncText=document.getElementById("syncText"),toast=document.getElementById("toast");let count=0,saving=false,toastTimer;
const pad=n=>String(n).padStart(2,"0"),formatDate=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`,formatKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function getPeriod(){const n=new Date();return{start:new Date(n.getFullYear(),n.getMonth(),1),end:new Date(n.getFullYear(),n.getMonth()+1,0)}}
const currentPeriod=getPeriod(),PERIOD_KEY=formatKey(currentPeriod.start),counterRef=doc(db,"counters",`${PROJECT_ID}_${PERIOD_KEY}`);
function renderPeriod(){periodEl.textContent=`${formatDate(currentPeriod.start)} — ${formatDate(currentPeriod.end)}`;const r=new Date(currentPeriod.end);r.setDate(r.getDate()+1);reportDateEl.textContent=`ЗВІТ: ${formatDate(r)}`;periodStartEl.textContent=`ПЕРІОД ${formatDate(currentPeriod.start)}`}
function render(){count=Math.max(0,Math.min(TARGET,count));const p=Math.round(count/TARGET*100),r=TARGET-count;countEl.textContent=count;percentEl.textContent=`${p}% виконано`;barEl.style.width=`${p}%`;remainingEl.textContent=r===0?"План виконано":`Залишилось ${r}`;statusEl.textContent=count===0?"ПОЧИНАЄМО":p<50?"В ПРОЦЕСІ":p<80?"БІЛЬШЕ ПОЛОВИНИ":p<100?"МАЙЖЕ ГОТОВО":"ГОТОВО ✓";minusBtn.classList.toggle("active",count>0)}
function showToast(t){clearTimeout(toastTimer);toast.textContent=t;toast.classList.add("show");toastTimer=setTimeout(()=>toast.classList.remove("show"),1700)}
async function loadCounter(){try{syncText.textContent="СИНХРОНІЗАЦІЯ...";const s=await getDoc(counterRef);if(s.exists())count=typeof s.data().count==="number"?s.data().count:0;else await setDoc(counterRef,{project:PROJECT_ID,period:PERIOD_KEY,count:0,target:TARGET,updatedAt:new Date().toISOString()});render();syncText.textContent="СИНХРОНІЗОВАНО"}catch(e){console.error(e);syncText.textContent="ПОМИЛКА СИНХРОНІЗАЦІЇ";showToast("Не вдалося завантажити дані")}}
async function saveCounter(n){if(saving)return;saving=true;const old=count;count=Math.max(0,Math.min(TARGET,n));render();syncText.textContent="ЗБЕРІГАЄМО...";try{await setDoc(counterRef,{project:PROJECT_ID,period:PERIOD_KEY,count,target:TARGET,updatedAt:new Date().toISOString()},{merge:true});syncText.textContent="СИНХРОНІЗОВАНО"}catch(e){count=old;render();syncText.textContent="ПОМИЛКА";showToast("Не вдалося зберегти зміну")}finally{saving=false}}
plusBtn.onclick=()=>count<TARGET&&saveCounter(count+1);minusBtn.onclick=()=>count>0&&saveCounter(count-1);renderPeriod();render();loadCounter();
</script></body></html>
