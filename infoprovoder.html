*{
  box-sizing:border-box;
  margin:0;
  padding:0;

:root{
  --green:#00f500;
  --red:#ff3b30;

html,body{

body{

.widget{
  width:100%;
  max-width:320px;
  margin:auto;
}


/* =========================
   MAIN CARD
========================= */

.card{
  overflow:hidden;

  padding:12px;

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.91),
      rgba(255,255,255,.67)

  border:
    1px solid rgba(255,255,255,.95);

  box-shadow:
    0 12px 30px rgba(0,0,0,.055),

  backdrop-filter:blur(20px);
}


/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 1px 9px;
}

.brand{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:8px;
  font-weight:950;
  letter-spacing:.11em;
}

.live-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 8px rgba(0,245,0,.55);

  animation:pulse 2s infinite;
}

@keyframes pulse{
  50%{
    opacity:.4;
    transform:scale(.8);
  }
}

.today{
  color:#999;

  font-size:6.5px;
  font-weight:850;
  letter-spacing:.05em;
}


/* =========================

========================= */

.section{

}

.section-count{
  color:#aaa;

  font-size:6px;

========================= */

  background:

    1px solid rgba(0,0,0,.035);

.event.super{

/* ==========================================================
   DATE HELPERS
========================================================== */

function makeDate(
  year,
  month,
  day
){

  return new Date(
    Date.UTC(
      year,
      month - 1,
      day
    )
  );

}


function kyivToday(){

  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Europe/Kyiv",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    );


  const parts =
    formatter.formatToParts(
      new Date()
    );


  const get =
    type =>
      Number(
        parts.find(
          item =>
            item.type === type
        ).value
      );


  return makeDate(
    get("year"),
    get("month"),
    get("day")
  );

}


function nthWeekday(
  year,
  month,
  weekday,
  nth
){

  const first =
    makeDate(
      year,
      month,
      1
    );


  const shift =
    (
      weekday -
      first.getUTCDay() +
      7
    ) % 7;


  return makeDate(
    year,
    month,
    1 +
    shift +
    (
      nth - 1
    ) * 7
  );

}


function daysBetween(
  start,
  end
){

  return Math.round(
    (
      end - start
    ) / DAY
  );

}


function formatDate(
  date
){

  return (
    date.getUTCDate()
    + " "
    + MONTHS[
        date.getUTCMonth()
      ]
  );

}

/* ==========================================================
   BUILD EVENTS FOR CURRENT + NEXT YEAR
========================================================== */

function buildCalendar(){

  const today =
    kyivToday();


  const year =
    today.getUTCFullYear();


  const result = [];


  [
    year,
    year + 1
  ]
  .forEach(
    currentYear => {

      EVENTS.forEach(
        event => {

          let date;


          if(
            event.type === "fixed"
          ){

            date =
              makeDate(
                currentYear,
                event.month,
                event.day
              );

          }

          else{

            date =
              event.resolver(
                currentYear
              );

          }


          result.push({
            ...event,
            date
          });

        }
      );

    }
  );


  return result
    .map(
      event => ({
        ...event,

        days:
          daysBetween(
            today,
            event.date
          )
      })
    )
    .filter(
      event =>
        event.days >= 0
    )
    .sort(
      (a,b) => {

        if(
          a.date - b.date !== 0
        ){

          return (
            a.date - b.date
          );

        }


        return (
          b.reminder -
          a.reminder
        );

      }
    );

}


/* ==========================================================
   REMOVE DUPLICATE GENERAL VERSION

   Якщо та сама назва/дата є як project event
   і як general event — залишаємо project version.
========================================================== */

function cleanDuplicates(
  events
){

  return events.filter(
    (event,index,array) => {

      const duplicates =
        array.filter(
          item =>
            item.name === event.name
            &&
            item.date.getTime()
              ===
            event.date.getTime()
        );


      if(
        duplicates.length === 1
      ){

        return true;

      }


      const projectVersion =
        duplicates.find(
          item =>
            item.projects
            &&
            item.projects.length
        );


      if(projectVersion){

        return (
          event === projectVersion
        );

      }


      return (
        duplicates[0] === event
      );

    }
  );

}


/* ==========================================================
   REMINDER TEXT
========================================================== */

function reminderText(
  event
){

  if(event.days === 0){

    return "СЬОГОДНІ";

  }


  if(event.days === 1){

    return "ЗАВТРА";

  }


  if(event.days === 2){

    return "ЧЕРЕЗ 2 ДНІ";

  }


  if(event.days === 3){

    return "ЧЕРЕЗ 3 ДНІ";

  }


  return (
    "ЧЕРЕЗ "
    + event.days
    + " ДНІВ"
  );

}


/* ==========================================================
   IMPORTANT EVENTS

   Тільки 10-day та 3-day.
   Всі активні показуємо.
========================================================== */

function getImportant(
  calendar
){

  return calendar.filter(
    event =>
      event.reminder > 1
      &&
      event.days <= event.reminder
  );

}


/* ==========================================================
   TOMORROW GENERAL

   Тут показуємо саме звичайні події,
   які завтра.

   Важливі project / 10-day events уже є зверху.
========================================================== */

function getTomorrowGeneral(
  calendar
){

  return calendar.filter(
    event =>
      event.days === 1
      &&
      event.reminder === 1
  );

}


/* ==========================================================
   RENDER IMPORTANT
========================================================== */

function renderImportant(
  events
){

  const section =
    document.getElementById(
      "importantSection"
    );


  const list =
    document.getElementById(
      "importantList"
    );


  const count =
    document.getElementById(
      "importantCount"
    );


  if(!events.length){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  count.textContent =
    events.length;


  list.innerHTML = "";


  events.forEach(
    event => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "event "
        +
        (
          event.reminder === 10
          ?
          "super "
          :
          "important "
        )
        +
        "theme-"
        +
        event.theme;


      let projectsHTML = "";


      if(
        event.projects
        &&
        event.projects.length
      ){

        projectsHTML = `

          <div class="projects">

            <div class="projects-label">
              ДЛЯ:
            </div>

            <div class="projects-names">
              ${event.projects.join(" · ")}
            </div>

          </div>

        `;

      }


      item.innerHTML = `

        <div class="event-top">

          <div class="event-date">

            <span class="emoji">
              ${event.emoji}
            </span>

            <span>
              ${formatDate(event.date)}
            </span>

          </div>


          <div class="reminder">
            ${reminderText(event)}
          </div>

        </div>


        <div class="event-name">
          ${event.name}
        </div>


        ${projectsHTML}

      `;


      list.appendChild(
        item
      );

    }
  );

}


/* ==========================================================
   RENDER TOMORROW
========================================================== */

function renderTomorrow(
  events,
  tomorrow
){

  const section =
    document.getElementById(
      "tomorrowSection"
    );


  const list =
    document.getElementById(
      "tomorrowList"
    );


  const count =
    document.getElementById(
      "tomorrowCount"
    );


  document
    .getElementById(
      "tomorrowDate"
    )
    .textContent =
      formatDate(
        tomorrow
      );


  if(!events.length){

    count.textContent = "";


    list.innerHTML = `

      <div class="empty">
        На завтра додаткових інфоприводів немає
      </div>

    `;

    return;

  }


  count.textContent =
    events.length;


  list.innerHTML = "";


  events.forEach(
    event => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "tomorrow-row";


      row.innerHTML = `

        <div class="tomorrow-emoji">
          ${event.emoji}
        </div>

        <div>
          ${event.name}
        </div>

      `;


      list.appendChild(
        row
      );

    }
  );

}


/* ==========================================================
   RENDER NEXT

   Шукаємо найближчу подію,
   яка НЕ показана в important
   і НЕ показана в tomorrow.
========================================================== */

function renderNext(
  calendar,
  important,
  tomorrowGeneral
){

  const used =
    new Set(
      [
        ...important,
        ...tomorrowGeneral
      ]
      .map(
        event =>
          event.name
          +
          "_"
          +
          event.date.getTime()
      )
    );


  const next =
    calendar.find(
      event => {

        const key =
          event.name
          +
          "_"
          +
          event.date.getTime();


        return (
          !used.has(key)
          &&
          event.days > 0
        );

      }
    );


  const block =
    document.getElementById(
      "nextBlock"
    );


  if(!next){

    block.style.display =
      "none";

    return;

  }


  block.style.display =
    "grid";


  document
    .getElementById(
      "nextName"
    )
    .textContent =
      next.emoji
      + " "
      + next.name;


  document
    .getElementById(
      "nextDate"
    )
    .textContent =
      formatDate(
        next.date
      );

}


/* ==========================================================
   HEADER
========================================================== */

function renderHeader(
  today
){

  document
    .getElementById(
      "today"
    )
    .textContent =
      WEEKDAYS[
        today.getUTCDay()
      ]
      +
      " · "
      +
      formatDate(
        today
      );

}


/* ==========================================================
   INIT
========================================================== */

function init(){

  const today =
    kyivToday();


  const tomorrow =
    new Date(
      today.getTime()
      + DAY
    );


  let calendar =
    buildCalendar();


  calendar =
    cleanDuplicates(
      calendar
    );


  const important =
    getImportant(
      calendar
    );


  const tomorrowGeneral =
    getTomorrowGeneral(
      calendar
    );


  renderHeader(
    today
  );


  renderImportant(
    important
  );


  renderTomorrow(
    tomorrowGeneral,
    tomorrow
  );


  renderNext(
    calendar,
    important,
    tomorrowGeneral
  );

}


init();
