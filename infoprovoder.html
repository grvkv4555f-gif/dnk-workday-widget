:root{

  --text:#111;
  --muted:#929292;
  --bg:#f7f7f5;
}

html,body{

body{

    radial-gradient(circle at 95% 0%,rgba(0,245,0,.08),transparent 30%),

  color:var(--text);
  padding:6px;
}

.widget{
  width:100%;
  max-width:320px;
  margin:auto;
}

.card{
  padding:11px 12px 9px;
  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.94),
      rgba(255,255,255,.72)

  border:1px solid rgba(255,255,255,.96);

  box-shadow:
    0 12px 30px rgba(0,0,0,.055),
    inset 0 1px 0 white;

  backdrop-filter:blur(20px);
}


/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  padding-bottom:8px;
}

.brand{
  display:flex;
  align-items:center;
  gap:5px;

  font-size:8px;
  font-weight:950;
  letter-spacing:.10em;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;

  background:var(--green);

  box-shadow:0 0 8px rgba(0,245,0,.55);

  animation:pulse 2s infinite;
}

@keyframes pulse{
  50%{
    opacity:.4;
    transform:scale(.8);
  }
}

.today{
  color:#aaa;
  font-size:6px;
  font-weight:850;
  letter-spacing:.05em;
  white-space:nowrap;
}


/* SECTION */

.section{
  margin-top:7px;
}

.section:first-of-type{
  margin-top:0;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;

  margin-bottom:5px;
}

.section-title{
  color:#777;

  font-size:6px;
  font-weight:950;
  letter-spacing:.09em;
}

.section-count{
  color:#aaa;

  font-size:5.5px;
  font-weight:900;
}


/* IMPORTANT */

.important-list{
  display:grid;
  gap:4px;
}

.event{
  position:relative;

  padding:7px 8px 7px 10px;

  border-radius:11px;

  background:rgba(255,255,255,.66);

  border:1px solid rgba(0,0,0,.03);

  overflow:hidden;
}

.event::before{
  content:"";

  position:absolute;
  left:0;
  top:0;
  bottom:0;

  width:2px;

  background:var(--red);
}

.event.super::before{
  background:var(--orange);
}


/* THEMES */

.event.fishing::before{background:#168ab6;}
.event.beauty::before{background:#d75ac8;}
.event.sewing::before{background:#7758df;}
.event.mental::before{background:#4c82ef;}
.event.ukraine::before{background:#3478f6;}

.event.earth::before{background:#35a86c;}

/* ==========================================
   BASIC DATE FUNCTIONS
========================================== */

const DAY = 24 * 60 * 60 * 1000;


const MONTHS = [
  "СІЧНЯ",
  "ЛЮТОГО",
  "БЕРЕЗНЯ",
  "КВІТНЯ",
  "ТРАВНЯ",
  "ЧЕРВНЯ",
  "ЛИПНЯ",
  "СЕРПНЯ",
  "ВЕРЕСНЯ",
  "ЖОВТНЯ",
  "ЛИСТОПАДА",
  "ГРУДНЯ"
];


const WEEKDAYS = [
  "НД",
  "ПН",
  "ВТ",
  "СР",
  "ЧТ",
  "ПТ",
  "СБ"
];


function d(
  year,
  month,
  day
){
  return new Date(
    Date.UTC(
      year,
      month - 1,
      day
    )
  );
}


function getKyivToday(){

  const formatter =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:"Europe/Kyiv",
        year:"numeric",
        month:"numeric",
        day:"numeric"
      }
    );


  const parts =
    formatter.formatToParts(
      new Date()
    );


  const year =
    Number(
      parts.find(
        p => p.type === "year"
      ).value
    );


  const month =
    Number(
      parts.find(
        p => p.type === "month"
      ).value
    );


  const day =
    Number(
      parts.find(
        p => p.type === "day"
      ).value
    );


  return d(
    year,
    month,
    day
  );
}


function diffDays(
  start,
  end
){
  return Math.round(
    (
      end.getTime()
      -
      start.getTime()
    )
    /
    DAY
  );
}


function formatDate(
  date
){
  return (
    date.getUTCDate()
    +
    " "
    +
    MONTHS[
      date.getUTCMonth()
    ]
  );
}


function nthWeekday(
  year,
  month,
  weekday,
  nth
){

  const first =
    d(
      year,
      month,
      1
    );


  const difference =
    (
      weekday
      -
      first.getUTCDay()
      +
      7
    )
    % 7;


  const day =
    1
    +
    difference
    +
    (
      nth - 1
    )
    * 7;


  return d(
    year,
    month,
    day
  );
}

/* ==========================================
   MOVING EVENTS
========================================== */

function getMovingEvents(year){

  const result = [];


  /* DAY OF VYSHYVANKA
     third Thursday of May
  */

  result.push({
    date:nthWeekday(
      year,
      5,
      4,
      3
    ),
    name:"День вишиванки",
    emoji:"🇺🇦",
    reminder:10,
    theme:"ukraine"
  });


  /* MOTHER'S DAY
     second Sunday of May
  */

  result.push({
    date:nthWeekday(
      year,
      5,
      0,
      2
    ),
    name:"День матері",
    emoji:"💐",
    reminder:10,
    theme:"family"
  });


  /* FATHER'S DAY
     third Sunday of June
  */

  result.push({
    date:nthWeekday(
      year,
      6,
      0,
      3
    ),
    name:"День батька",
    emoji:"💙",
    reminder:10,
    theme:"family"
  });


  /* FISHERMAN'S DAY UKRAINE
     second Sunday of July
  */

  result.push({
    date:nthWeekday(
      year,
      7,
      0,
      2
    ),
    name:"День рибалки України",
    emoji:"🎣",
    reminder:3,
    theme:"fishing",
    projects:[
      "CARP PRO",
      "AZURA",
      "AERODROM"
    ]
  });


  /* LIGHT INDUSTRY WORKERS
     second Sunday of June
  */

  result.push({
    date:nthWeekday(
      year,
      6,
      0,
      2
    ),
    name:"День працівників легкої промисловості",
    emoji:"🪡",
    reminder:3,
    theme:"sewing",
    projects:[
      "AMTEX"
    ]
  });


  /* ENTREPRENEUR DAY
     first Sunday of September
  */

  result.push({
    date:nthWeekday(
      year,
      9,
      0,
      1
    ),
    name:"День підприємця",
    emoji:"💼",
    reminder:3,
    theme:"sewing",
    projects:[
      "AMTEX"
    ]
  });


  /* BLACK FRIDAY
     Friday after fourth Thursday of November
  */

  const thanksgiving =
    nthWeekday(
      year,
      11,
      4,
      4
    );


  result.push({
    date:new Date(
      thanksgiving.getTime()
      +
      DAY
    ),
    name:"Black Friday",
    emoji:"🛍️",
    reminder:10,
    theme:"shopping"
  });


  return result;
}


/* ==========================================
   BUILD CALENDAR
========================================== */

function buildCalendar(){

  const today =
    getKyivToday();


  const currentYear =
    today.getUTCFullYear();


  const calendar = [];


  [
    currentYear,
    currentYear + 1
  ]
  .forEach(year => {


    fixedEvents.forEach(event => {

      calendar.push({
        ...event,

        date:d(
          year,
          event.month,
          event.day
        )
      });

    });


    getMovingEvents(year)
      .forEach(event => {

        calendar.push(event);

      });

  });


  return calendar
    .map(event => ({
      ...event,

      days:
        diffDays(
          today,
          event.date
        )
    }))
    .filter(event =>
      event.days >= 0
    )
    .sort((a,b) => {

      if(
        a.date.getTime()
        !==
        b.date.getTime()
      ){
        return (
          a.date.getTime()
          -
          b.date.getTime()
        );
      }


      return (
        b.reminder
        -
        a.reminder
      );

    });

}


/* ==========================================
   DUPLICATES

   Якщо є project version тієї самої
   події — general version прибираємо.
========================================== */

function removeDuplicates(calendar){

  const result = [];


  calendar.forEach(event => {

    const same =
      calendar.filter(other =>
        other.name === event.name
        &&
        other.date.getTime()
          ===
        event.date.getTime()
      );


    if(same.length === 1){

      result.push(event);

      return;

    }


    const projectVersion =
      same.find(item =>
        Array.isArray(item.projects)
        &&
        item.projects.length > 0
      );


    if(projectVersion){

      if(
        event === projectVersion
      ){
        result.push(event);
      }

      return;

    }


    if(
      event === same[0]
    ){
      result.push(event);
    }

  });


  return result;
}


/* ==========================================
   BADGE TEXT
========================================== */

function getBadge(event){

  if(event.days === 0){
    return "СЬОГОДНІ";
  }

  if(event.days === 1){
    return "ЗАВТРА";
  }

  if(event.days === 2){
    return "ЧЕРЕЗ 2 ДНІ";
  }

  if(event.days === 3){
    return "ЧЕРЕЗ 3 ДНІ";
  }

  if(event.days === 4){
    return "ЧЕРЕЗ 4 ДНІ";
  }

  return (
    "ЧЕРЕЗ "
    +
    event.days
    +
    " ДНІВ"
  );

}


/* ==========================================
   IMPORTANT
========================================== */

function renderImportant(calendar){

  const important =
    calendar.filter(event =>
      event.reminder > 1
      &&
      event.days <= event.reminder
    );


  const section =
    document.getElementById(
      "importantSection"
    );


  const list =
    document.getElementById(
      "importantList"
    );


  const count =
    document.getElementById(
      "importantCount"
    );


  if(important.length === 0){

    section.style.display =
      "none";

    return important;
  }


  section.style.display =
    "block";


  count.textContent =
    important.length;


  list.innerHTML = "";


  important.forEach(event => {

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "event "
      +
      (
        event.reminder === 10
        ? "super "
        : ""
      )
      +
      (
        event.theme || ""
      );


    let projectsHTML = "";


    if(
      Array.isArray(event.projects)
      &&
      event.projects.length > 0
    ){

      projectsHTML = `

        <div class="projects">

          <strong>
            ДЛЯ:
          </strong>

          ${event.projects.join(" · ")}

        </div>

      `;

    }


    item.innerHTML = `

      <div class="event-top">

        <div class="event-date">

          <span class="emoji">
            ${event.emoji}
          </span>

          ${formatDate(event.date)}

        </div>


        <div class="badge">
          ${getBadge(event)}
        </div>

      </div>


      <div class="event-name">
        ${event.name}
      </div>


      ${projectsHTML}

    `;


    list.appendChild(item);

  });


  return important;
}


/* ==========================================
   TOMORROW GENERAL
========================================== */

function renderTomorrow(calendar){

  const today =
    getKyivToday();


  const tomorrow =
    new Date(
      today.getTime()
      +
      DAY
    );


  const events =
    calendar.filter(event =>
      event.days === 1
      &&
      event.reminder === 1
    );


  document
    .getElementById(
      "tomorrowDate"
    )
    .textContent =
      formatDate(tomorrow);


  document
    .getElementById(
      "tomorrowCount"
    )
    .textContent =
      events.length
      ?
      events.length
      :
      "";


  const list =
    document.getElementById(
      "tomorrowList"
    );


  list.innerHTML = "";


  if(events.length === 0){

    list.innerHTML = `

      <div class="empty">
        На завтра додаткових інфоприводів немає
      </div>

    `;

    return events;
  }


  events.forEach(event => {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "tomorrow-row";


    row.innerHTML = `

      <div class="tomorrow-emoji">
        ${event.emoji}
      </div>

      <div>
        ${event.name}
      </div>

    `;


    list.appendChild(row);

  });


  return events;
}


/* ==========================================
   NEXT
========================================== */

function renderNext(
  calendar,
  important,
  tomorrowEvents
){

  const used =
    new Set();


  important.forEach(event => {

    used.add(
      event.name
      +
      "|"
      +
      event.date.getTime()
    );

  });


  tomorrowEvents.forEach(event => {

    used.add(
      event.name
      +
      "|"
      +
      event.date.getTime()
    );

  });


  const next =
    calendar.find(event => {

      const key =
        event.name
        +
        "|"
        +
        event.date.getTime();


      return (
        event.days > 0
        &&
        !used.has(key)
      );

    });


  const block =
    document.getElementById(
      "nextBlock"
    );


  if(!next){

    block.style.display =
      "none";

    return;
  }


  block.style.display =
    "grid";


  document
    .getElementById(
      "nextName"
    )
    .textContent =
      next.emoji
      +
      " "
      +
      next.name;


  document
    .getElementById(
      "nextDate"
    )
    .textContent =
      formatDate(next.date);

}


/* ==========================================
   HEADER
========================================== */

function renderHeader(){

  const today =
    getKyivToday();


  document
    .getElementById(
      "today"
    )
    .textContent =
      WEEKDAYS[
        today.getUTCDay()
      ]
      +
      " · "
      +
      formatDate(today);

}


/* ==========================================
   START
========================================== */

function start(){

  renderHeader();


  let calendar =
    buildCalendar();


  calendar =
    removeDuplicates(
      calendar
    );


  const important =
    renderImportant(
      calendar
    );


  const tomorrow =
    renderTomorrow(
      calendar
    );


  renderNext(
    calendar,
    important,
    tomorrow
  );

}


start();
