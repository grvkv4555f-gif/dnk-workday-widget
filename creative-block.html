<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

:root{
  --green:#00f500;
  --text:#111;
  --muted:#747474;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%, rgba(0,245,0,.08), transparent 28%),
    radial-gradient(circle at 90% 80%, rgba(0,245,0,.05), transparent 30%),
    #f7f7f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:22px;
}

.glass{
  background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 18px 45px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,1);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.brand{
  font-size:12px;
  font-weight:900;
  letter-spacing:.8px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px rgba(0,245,0,.55);
}

.screen{
  display:none;
  animation:appear .35s ease;
}

.screen.active{display:block}

@keyframes appear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.question-card{
  border-radius:28px;
  padding:38px 28px;
  text-align:center;
}

.eyebrow{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.2px;
  color:#888;
  margin-bottom:12px;
}

h1{
  font-size:32px;
  line-height:1.08;
  margin:0 0 12px;
  letter-spacing:-1px;
}

.sub{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  max-width:460px;
  margin:0 auto;
}

.main-button{
  width:100%;
  border:0;
  border-radius:18px;
  background:var(--green);
  padding:18px;
  margin-top:16px;
  font-size:15px;
  font-weight:900;
  color:#080808;
  cursor:pointer;
  box-shadow:
    0 12px 25px rgba(0,245,0,.17),
    inset 0 1px 0 rgba(255,255,255,.55);
  transition:.2s ease;
}

.main-button:hover{
  transform:translateY(-1px);
  filter:brightness(.96);
}

.selector{
  padding:10px;
  border-radius:25px;
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.format{
  border:0;
  background:transparent;
  border-radius:19px;
  padding:22px 10px;
  cursor:pointer;
  transition:.22s ease;
  color:#222;
}

.format:hover{
  background:rgba(255,255,255,.75);
  box-shadow:0 8px 20px rgba(0,0,0,.07);
}

.format-icon{
  display:block;
  font-size:24px;
  margin-bottom:8px;
}

.format-name{
  font-size:13px;
  font-weight:900;
}

.idea-card{
  border-radius:28px;
  padding:27px;
}

.idea-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:23px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(0,245,0,.11);
  font-size:10px;
  font-weight:900;
  letter-spacing:.5px;
}

.change{
  border:0;
  background:transparent;
  color:#777;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.idea-title{
  font-size:27px;
  line-height:1.12;
  font-weight:900;
  letter-spacing:-.5px;
  margin-bottom:12px;
}

.description{
  color:#5f5f5f;
  font-size:14px;
  line-height:1.55;
  margin-bottom:25px;
}

.structure-box{
  background:rgba(255,255,255,.72);
  border-radius:19px;
  padding:18px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    0 8px 25px rgba(0,0,0,.04);
}

.structure-label{
  font-size:9px;
  letter-spacing:1px;
  font-weight:900;
  color:#00ba00;
  margin-bottom:9px;
}

.structure{
  font-size:14px;
  line-height:1.6;
  font-weight:650;
}

.counter{
  text-align:center;
  font-size:10px;
  color:#9a9a9a;
  margin-top:11px;
}

@media(max-width:520px){
  .app{padding:14px}

  h1{font-size:27px}

  .question-card{padding:32px 18px}

  .selector{
    gap:5px;
    padding:7px;
  }

  .format{
    padding:18px 5px;
  }

  .format-icon{font-size:21px}
  .format-name{font-size:11px}

  .idea-card{padding:20px}
  .idea-title{font-size:23px}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="brand">DNK CREATIVE SOS</div>
    <div class="dot"></div>
  </div>

  <!-- ЕКРАН 1 -->
  <section id="start" class="screen active">
    <div class="question-card glass">
      <div class="eyebrow">ТВОРЧИЙ ЗАТИК?</div>
      <h1>Немає що постити?</h1>
      <div class="sub">
        Таке буває. Зараз знайдемо механіку 👀
      </div>
    </div>

    <button class="main-button" onclick="showFormats()">
      ТАК 😭
    </button>
  </section>


  <!-- ЕКРАН 2 -->
  <section id="formats" class="screen">
    <div class="question-card glass">
      <div class="eyebrow">ОКЕЙ, РОЗБИРАЄМОСЬ</div>
      <h1>З чим треба допомога?</h1>
      <div class="sub">
        Обери формат — і я дам механіку саме під нього.
      </div>

      <div class="selector glass">

        <button class="format" onclick="chooseFormat('reels')">
          <span class="format-icon">🎬</span>
          <span class="format-name">REELS</span>
        </button>

        <button class="format" onclick="chooseFormat('stories')">
          <span class="format-icon">📲</span>
          <span class="format-name">STORIES</span>
        </button>

        <button class="format" onclick="chooseFormat('posts')">
          <span class="format-icon">📝</span>
          <span class="format-name">ДОПИС</span>
        </button>

      </div>
    </div>
  </section>


  <!-- ЕКРАН 3 -->
  <section id="idea" class="screen">

    <div class="idea-card glass">

      <div class="idea-top">
        <div class="badge" id="badge">● STORIES</div>

        <button class="change" onclick="showFormats()">
          ← ЗМІНИТИ ФОРМАТ
        </button>
      </div>

      <div class="idea-title" id="ideaTitle"></div>

      <div class="description" id="ideaDescription"></div>

      <div class="structure-box">
        <div class="structure-label">СТРУКТУРА</div>
        <div class="structure" id="ideaStructure"></div>
      </div>

    </div>

    <button class="main-button" onclick="generateIdea()">
      ↻ ПОКАЗАТИ ІНШУ ІДЕЮ
    </button>

    <div class="counter" id="counter"></div>

  </section>

</div>


<script>

/* =========================
   STORIES — 50
========================= */

const stories = [

["ЗНАЙДИ ПОМИЛКУ",
"Покажи ситуацію з навмисною помилкою й запропонуй підписникам знайти її.",
"1 сторіс — ситуація → 2 — «Що тут не так?» + опитування → 3 — відповідь → 4 — пояснення."],

["ПРАВДА ЧИ МІФ?",
"Дай твердження без відповіді й спочатку попроси аудиторію визначитися.",
"1 — твердження → 2 — голосування «правда / міф» → 3 — відповідь → 4 — пояснення."],

["А ЧИ Б?",
"Дай два варіанти одного рішення й попроси обрати.",
"1 — ситуація → 2 — А чи Б + опитування → 3 — різниця → 4 — коли який варіант доречний."],

["ЩО Б ВИ ЗРОБИЛИ?",
"Постав підписника на місце героя реальної ситуації.",
"1 — контекст → 2 — проблема → 3 — варіанти дій → 4 — відповідь експерта."],

["ВГАДАЙ РЕЗУЛЬТАТ",
"Покажи стартову ситуацію, але не показуй фінал одразу.",
"1 — «до» → 2 — як думаєте, що вийшло? → 3 — результат → 4 — пояснення."],

["ТАК МОЖНА ЧИ НІ?",
"Візьми одну конкретну дію, щодо якої аудиторія може сумніватися.",
"1 — «Можна ___?» → 2 — так / ні → 3 — правильна відповідь → 4 — важливий нюанс."],

["ЗНАЙДИ 3 ПОМИЛКИ",
"Перетвори експертну тему на невелику гру.",
"1 — ситуація → 2 — «знайдеш 3 помилки?» → 3 — reveal → 4–5 — короткий розбір кожної."],

["ПЕРЕВІР СЕБЕ",
"Зроби короткий тест, за яким людина може впізнати свою ситуацію.",
"1 — вступ → 2–4 — питання → 5 — результат → 6 — що він означає."],

["ЩО ЗАЙВЕ?",
"Покажи кілька варіантів, серед яких один не підходить.",
"1 — 4 варіанти → 2 — вибір → 3 — правильна відповідь → 4 — пояснення."],

["РОЗСТАВ ПО ПОРЯДКУ",
"Дай етапи процесу в неправильній послідовності.",
"1 — перемішані етапи → 2 — відповідь аудиторії → 3 — правильний порядок → 4 — пояснення."],

["ВПІЗНАЄШ СЕБЕ?",
"Покажи типову поведінку або ситуацію своєї аудиторії.",
"1 — ситуація → 2–3 — характерні ознаки → 4 — «впізнали себе?» → 5 — рекомендація."],

["ОБЕРИ СВІЙ СЦЕНАРІЙ",
"Дай кілька типових ситуацій і дозволь людині знайти свою.",
"1 — питання → 2 — А / Б / В → 3–5 — рекомендація для кожного сценарію."],

["ПИТАННЯ ДНЯ ЕКСПЕРТУ",
"Візьми одне вузьке питання замість великої теми.",
"1 — питання → 2 — коротка відповідь → 3 — пояснення → 4 — висновок."],

["РОЗБІР ВІДПОВІДІ ПІДПИСНИКА",
"Використай відповідь із question box як основу нового контенту.",
"1 — скрін відповіді → 2 — реакція → 3 — розбір → 4 — рекомендація."],

["НАПИШИ СИТУАЦІЮ — РОЗБЕРЕМО",
"Залучи аудиторію до створення наступних сторіс.",
"1 — запит → 2 — question box → 3 — обрана відповідь → 4–5 — розбір."],

["ЯК ДУМАЄТЕ, ЧОМУ?",
"Покажи цікавий факт або результат без пояснення.",
"1 — факт → 2 — «чому так?» → 3 — версії → 4 — справжня причина."],

["ЩО СТАЛОСЯ МІЖ ЦИМИ КАДРАМИ?",
"Покажи дві точки одного процесу й приховай середину.",
"1 — до / після → 2 — припущення → 3–4 — що відбулося → 5 — висновок."],

["ВГАДАЙ ЦИФРУ",
"Використай неочевидну ціну, час, кількість або обсяг.",
"1 — питання → 2 — варіанти → 3 — правильна цифра → 4 — її контекст."],

["НАСКІЛЬКИ ЦЕ КРИТИЧНО?",
"Запропонуй аудиторії оцінити конкретну ситуацію.",
"1 — ситуація → 2 — шкала 1–10 → 3 — оцінка експерта → 4 — пояснення."],

["ЩО ОБЕРЕ ЕКСПЕРТ?",
"Покажи кілька варіантів і запропонуй вгадати вибір спеціаліста.",
"1 — умова → 2 — А / Б / В → 3 — вибір експерта → 4 — аргумент."],

["МІКРОКОНСУЛЬТАЦІЯ",
"Розбери типовий запит так, ніби це маленька консультація.",
"1 — запит → 2 — що потрібно уточнити → 3 — на що дивимося → 4 — рекомендація."],

["ОДНА ПОМИЛКА СЬОГОДНІ",
"Регулярна рубрика з однією конкретною помилкою.",
"1 — помилка → 2 — чому її допускають → 3 — наслідок → 4 — як правильно."],

["ОДИН ФАКТ, ЯКИЙ ВАРТО ЗНАТИ",
"Дай одну корисну думку без перевантаження.",
"1 — факт → 2 — чому важливий → 3 — приклад → 4 — що запамʼятати."],

["НЕ ПЛУТАЙ ЦЕ З ЦИМ",
"Розведи два поняття, які аудиторія часто плутає.",
"1 — А ≠ Б → 2 — що таке А → 3 — що таке Б → 4 — головна різниця."],

["А ЩО БУДЕ, ЯКЩО…?",
"Відповідай на конкретний страх або цікавість аудиторії.",
"1 — питання → 2 — коротка відповідь → 3 — наслідок → 4 — що робити."],

["КОЛИ ЦЕ НЕ ПРАЦЮЄ?",
"Покажи обмеження методу, продукту або підходу.",
"1 — очікування → 2 — коли не працює → 3 — чому → 4 — альтернатива."],

["3 СИГНАЛИ, ЩО…",
"Дай аудиторії прості орієнтири для своєї ситуації.",
"1 — тема → 2–4 — три сигнали → 5 — що робити далі."],

["ОЧІКУВАННЯ → РЕАЛЬНІСТЬ",
"Порівняй типове уявлення аудиторії з тим, як усе відбувається насправді.",
"1 — очікування → 2 — голосування → 3 — реальність → 4 — пояснення."],

["ВІДПОВІДЬ НА НЕЗРУЧНЕ ПИТАННЯ",
"Візьми питання, яке люди часто соромляться ставити.",
"1 — питання → 2 — пряма відповідь → 3 — пояснення → 4 — важливий нюанс."],

["РОЗБІР КОМЕНТАРЯ",
"Перетвори реальний коментар на серію сторіс.",
"1 — скрін → 2 — що тут важливо → 3 — розбір → 4 — висновок."],

["СЬОГОДНІ ПОКАЖЕМО ВЕСЬ ШЛЯХ",
"Проведи аудиторію через реальний процес протягом дня.",
"1 — старт → 2 — підготовка → 3–4 — процес → 5 — результат → 6 — висновок."],

["ДО / ПІД ЧАС / ПІСЛЯ",
"Поясни одну тему через три фази.",
"1 — що важливо до → 2–3 — під час → 4 — після → 5 — головна помилка."],

["ЗА КАДРОМ",
"Покажи роботу, якої не видно у фінальному результаті.",
"1 — результат → 2 — «а перед цим…» → 3–4 — невидимі етапи → 5 — фінал."],

["ЩО СЬОГОДНІ ПІШЛО НЕ ЗА ПЛАНОМ",
"Зроби з реальної робочої проблеми коротку історію.",
"1 — план → 2 — що сталося → 3 — що зробили → 4 — результат."],

["ОДИН ДЕНЬ — ОДНА ІСТОРІЯ",
"Замість хаотичних сторіс побудуй сюжет дня.",
"1 — задача дня → 2–4 — розвиток → 5 — ключовий момент → 6 — завершення."],

["КЛІЄНТ ПРИЙШОВ І СКАЗАВ…",
"Почни історію з конкретної фрази клієнта.",
"1 — цитата → 2 — що за нею стояло → 3 — що зробили → 4 — результат."],

["ПЕРШИЙ РАЗ",
"Покажи перший досвід клієнта, спеціаліста або команди.",
"1 — очікування → 2 — момент перед → 3 — процес → 4 — реакція після."],

["ВІД ЗАПИТУ ДО РЕЗУЛЬТАТУ",
"Розкажи міні-кейс у кількох сторіс.",
"1 — запит → 2 — що визначили → 3 — що зробили → 4 — результат."],

["ЧОМУ МИ ЗРОБИЛИ САМЕ ТАК?",
"Поясни логіку конкретного рішення команди.",
"1 — ситуація → 2 — наше рішення → 3 — які були альтернативи → 4 — чому обрали це."],

["ЩО МИ ПЕРЕВІРЯЄМО ПЕРЕД…",
"Покажи внутрішній контроль перед фінальним результатом.",
"1 — контекст → 2–4 — перевірки → 5 — навіщо → 6 — готово."],

["ЩО ЗАРАЗ ВІДБУВАЄТЬСЯ?",
"Зроби короткий живий репортаж із процесу.",
"1 — де ми → 2 — що відбувається → 3 — коментар → 4 — що буде далі."],

["3 РЕЧІ, ЯКІ МИ ЗАРАЗ РОБИМО",
"Швидко покажи поточну роботу команди.",
"1 — задача → 2 — дія 1 → 3 — дія 2 → 4 — дія 3 → 5 — результат."],

["ОДНЕ ПИТАННЯ ВСІЙ КОМАНДІ",
"Постав однакове питання кільком людям.",
"1 — питання → 2–4 — відповіді → 5 — спільний або контрастний висновок."],

["ВИБЕРІТЬ, ЩО ПОКАЗАТИ ДАЛІ",
"Дай аудиторії можливість керувати наступним контентом.",
"1 — два варіанти → 2 — голосування → 3 — результат → 4+ — показуємо переможця."],

["ВИ ПИТАЛИ — ПОКАЗУЄМО",
"Візьми частий запит і покажи відповідь на практиці.",
"1 — питання → 2–3 — демонстрація → 4 — результат → 5 — коментар."],

["ПРОДУКТ У РЕАЛЬНОМУ ЖИТТІ",
"Покажи продукт не каталожно, а в реальній ситуації.",
"1 — ситуація → 2 — потреба → 3 — використання → 4 — результат."],

["ЯК ОБРАТИ?",
"Зроби простий міні-підбір через кілька запитань.",
"1 — що потрібно? → 2 — умова А/Б → 3 — відповідний варіант → 4 — пояснення."],

["ДЛЯ КОГО ЦЕ?",
"Допоможи людині впізнати власну потребу.",
"1 — ситуація 1 → 2 — ситуація 2 → 3 — ситуація 3 → 4 — кому підійде / кому ні."],

["ЩО В КОМПЛЕКТІ?",
"Розклади продукт або послугу на складові.",
"1 — загальний вигляд → 2–4 — складові → 5 — навіщо кожна → 6 — весь комплект."],

["ПОКАЖІТЬ НАМ СВОЄ — МИ ПРОКОМЕНТУЄМО",
"Запроси аудиторію надіслати власний приклад для майбутнього розбору.",
"1 — заклик → 2 — що можна надіслати → 3 — приклад → 4 — обіцяний формат розбору."]

];


/* =========================
   REELS — 50
========================= */

const reels = [

["РЕЗУЛЬТАТ У ПЕРШУ СЕКУНДУ",
"Почни з найсильнішого кадру, а вже потім покажи шлях.",
"0–2 сек — результат → «як ми до цього прийшли?» → процес → повтор фіналу."],

/* =========================
   LOGIC
========================= */

const libraries = {
  stories,
  reels,
  posts
};

const labels = {
  stories:"STORIES",
  reels:"REELS",
  posts:"ДОПИС / КАРУСЕЛЬ"
};

let selectedFormat = null;
let lastIndexes = {
  stories:-1,
  reels:-1,
  posts:-1
};

function setScreen(id){
  document.querySelectorAll(".screen")
    .forEach(screen => screen.classList.remove("active"));

  document.getElementById(id).classList.add("active");
}

function showFormats(){
  setScreen("formats");
}

function chooseFormat(format){
  selectedFormat = format;
  generateIdea();
  setScreen("idea");
}

function generateIdea(){

  if(!selectedFormat) return;

  const library = libraries[selectedFormat];

  let index;

  do{
    index = Math.floor(Math.random() * library.length);
  }while(index === lastIndexes[selectedFormat] && library.length > 1);

  lastIndexes[selectedFormat] = index;

  const item = library[index];

  document.getElementById("badge").textContent =
    "● " + labels[selectedFormat];

  document.getElementById("ideaTitle").textContent = item[0];
  document.getElementById("ideaDescription").textContent = item[1];
  document.getElementById("ideaStructure").textContent = item[2];

  document.getElementById("counter").textContent =
    labels[selectedFormat] + " • Ідея " +
    (index + 1) + " із " + library.length;
}

</script>
