<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

:root{
  --green:#00f500;
  --text:#111;
  --muted:#7b7b7b;
  --bg:#f7f7f5;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,rgba(0,245,0,.08),transparent 28%),
    radial-gradient(circle at 90% 80%,rgba(0,245,0,.05),transparent 30%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:22px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.title{
  font-size:12px;
  font-weight:900;
  letter-spacing:.8px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px rgba(0,245,0,.55);
}

.glass{
  background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 18px 45px rgba(0,0,0,.08),
    inset 0 1px 0 rgba(255,255,255,1);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.card{
  border-radius:28px;
  padding:27px;
}

.eyebrow{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.2px;
  color:#8b8b8b;
  margin-bottom:9px;
}

h1{
  margin:0;
  font-size:28px;
  line-height:1.1;
  letter-spacing:-.7px;
}

.description{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}

/* NETWORKS */

.networks{
  display:flex;
  gap:7px;
  padding:7px;
  margin-top:22px;
  border-radius:21px;
  overflow-x:auto;
  scrollbar-width:none;
}

.networks::-webkit-scrollbar{display:none}

.network{
  flex:1;
  min-width:105px;
  border:0;
  border-radius:16px;
  background:transparent;
  padding:14px 10px;
  font-size:11px;
  font-weight:900;
  color:#888;
  cursor:pointer;
  transition:.22s ease;
}

.network.active{
  color:#111;
  background:rgba(255,255,255,.88);
  box-shadow:
    0 7px 20px rgba(0,0,0,.07),
    inset 0 1px 0 white,
    0 0 18px rgba(0,245,0,.05);
}

/* FORMATS */

.formats{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.format{
  border:0;
  border-radius:999px;
  background:rgba(255,255,255,.58);
  color:#777;
  padding:10px 13px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.25px;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}

.format.active{
  background:#111;
  color:#fff;
  box-shadow:
    0 8px 18px rgba(0,0,0,.12),
    0 0 16px rgba(0,245,0,.06);
}

/* RESULT */

.result{
  margin-top:15px;
  padding:22px;
  border-radius:22px;
  background:rgba(255,255,255,.72);
  box-shadow:
    inset 0 1px 0 white,
    0 8px 25px rgba(0,0,0,.045);
  animation:appear .25s ease;
}

@keyframes appear{
  from{opacity:.2;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}

.result-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.result-name{
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
  color:#777;
}

.platform{
  font-size:9px;
  font-weight:900;
  color:#00b800;
}

.size{
  font-size:35px;
  font-weight:900;
  letter-spacing:-1px;
  margin-top:14px;
}

.ratio{
  display:inline-flex;
  margin-top:8px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(0,245,0,.1);
  font-size:10px;
  font-weight:900;
}

.note{
  margin-top:15px;
  color:#696969;
  font-size:13px;
  line-height:1.5;
}

@media(max-width:520px){
  .app{padding:14px}
  .card{padding:20px}
  h1{font-size:25px}
  .networks{display:grid;grid-template-columns:repeat(2,1fr)}
  .network{min-width:0}
  .size{font-size:29px}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">📐 РОЗМІРИ КОНТЕНТУ</div>
    <div class="dot"></div>
  </div>

  <div class="card glass">

    <div class="eyebrow">ШПАРГАЛКА ДЛЯ КОМАНДИ</div>

    <h1>Для чого готуємо контент?</h1>

    <div class="description">
      Обери соцмережу та потрібний формат.
    </div>

    <div class="networks glass" id="networks"></div>

    <div class="formats" id="formats"></div>

    <div class="result" id="result">

      <div class="result-top">
        <div class="result-name" id="resultName"></div>
        <div class="platform" id="platform"></div>
      </div>

      <div class="size" id="size"></div>

      <div class="ratio" id="ratio"></div>

      <div class="note" id="note"></div>

    </div>

  </div>
</div>

<script>

const data = {

    ]
  },

      {

      },
      {
        name:"STORIES",

        ratio:"9:16",
        note:"Вертикальний формат на весь екран."
      },
      {
        name:"REELS",
        size:"1080 × 1920 px",
        ratio:"9:16",
        note:"Вертикальний формат для коротких відео."
      },
      {
        name:"ОБКЛАДИНКА",
        size:"851 × 315 px",

        note:"Для обкладинки сторінки. Важливі елементи краще не ставити близько до країв."
      }
    ]
  },

  tiktok:{
    label:"TIKTOK",
    formats:[
      {
        name:"ВІДЕО",
        size:"1080 × 1920 px",
        ratio:"9:16",
        note:"Основний вертикальний формат TikTok."
      },
      {
        name:"ФОТО",
        size:"1080 × 1920 px",
        ratio:"9:16",
        note:"Для вертикального фото-контенту та слайдів."
      },
      {
        name:"ОБКЛАДИНКА",

  },

  linkedin:{
    label:"LINKEDIN",
    formats:[
      {
        name:"ВЕРТИКАЛЬНИЙ ДОПИС",
        size:"1080 × 1350 px",

        note:"Практичний вертикальний формат для органічного контенту."
      },

      }
    ]
  },

  youtube:{
    label:"YOUTUBE",
    formats:[
      {
        name:"ВІДЕО",
        size:"1920 × 1080 px",
        ratio:"16:9",
        note:"Стандартний Full HD формат для горизонтального відео."
      },
      {
        name:"THUMBNAIL",
        size:"3840 × 2160 px",
        ratio:"16:9",
        note:"YouTube рекомендує завантажувати максимально велике превʼю; актуальна рекомендація — 3840 × 2160."
      },
      {
        name:"SHORTS",
        size:"1080 × 1920 px",

        note:"Вертикальний формат коротких відео."
      },
      {
        name:"THUMBNAIL SHORTS",
        size:"2160 × 3840 px",
        ratio:"9:16",
        note:"Актуальна рекомендація YouTube для кастомного превʼю Shorts."
      },
      {
        name:"БАНЕР КАНАЛУ",
        size:"2560 × 1440 px",
        ratio:"16:9",
        note:"Рекомендований YouTube розмір. Безпечна зона для тексту й логотипів — приблизно 1235 × 338 px."
      }
    ]
  }

};


let currentNetwork = "instagram";
let currentFormat = 0;


const networks = document.getElementById("networks");
const formats = document.getElementById("formats");


function renderNetworks(){

  networks.innerHTML = "";

  Object.keys(data).forEach(key=>{

    const button = document.createElement("button");

    button.className =
      "network" +
      (key === currentNetwork ? " active" : "");

    button.textContent = data[key].label;

    button.onclick = ()=>{
      currentNetwork = key;
      currentFormat = 0;
      renderAll();
    };

    networks.appendChild(button);
  });
}


function renderFormats(){

  formats.innerHTML = "";

  data[currentNetwork].formats.forEach((item,index)=>{

    const button = document.createElement("button");

    button.className =
      "format" +
      (index === currentFormat ? " active" : "");

    button.textContent = item.name;

    button.onclick = ()=>{
      currentFormat = index;
      renderFormats();
      renderResult();
    };

    formats.appendChild(button);
  });
}


function renderResult(){

  const item =
    data[currentNetwork].formats[currentFormat];

  const result =
    document.getElementById("result");

  result.style.animation = "none";
  void result.offsetWidth;
  result.style.animation = "appear .25s ease";

  document.getElementById("resultName")
    .textContent = item.name;

  document.getElementById("platform")
    .textContent = data[currentNetwork].label;

  document.getElementById("size")
    .textContent = item.size;

  document.getElementById("ratio")
    .textContent = "СПІВВІДНОШЕННЯ " + item.ratio;

  document.getElementById("note")
    .textContent = item.note;
}


function renderAll(){
  renderNetworks();
  renderFormats();
  renderResult();
}

renderAll();

</script>

</body>
</html>
