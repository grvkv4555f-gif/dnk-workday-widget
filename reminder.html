<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DNK Reminder</title>

  <style>
    :root {
      --green: #00f500;
      --black: #111111;
      --gray: #8f8f8f;
      --light-gray: #e8e8e5;
      --bg: #f7f7f5;
      --glass: rgba(255, 255, 255, 0.72);
      --danger: #e5484d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--black);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(0, 245, 0, 0.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(0, 245, 0, 0.07),
          transparent 28%
        ),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .widget {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ==============================
       HEADER
    ============================== */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .green-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;

      border-radius: 50%;
      background: var(--green);

      box-shadow:
        0 0 0 4px rgba(0, 245, 0, 0.1),
        0 0 14px rgba(0, 245, 0, 0.55);
    }

    .sync {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--gray);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ==============================
       GLASS CARD
    ============================== */

    .card {
      position: relative;
      overflow: hidden;

      padding: 24px;

      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;

      background: var(--glass);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -100px;
      right: -80px;

      border-radius: 50%;
      background: rgba(0, 245, 0, 0.09);
      filter: blur(25px);

      pointer-events: none;
    }

    /* ==============================
       INTRO
    ============================== */

    .icon {
      display: grid;
      place-items: center;

      width: 58px;
      height: 58px;

      margin-bottom: 18px;

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96),
          rgba(235, 235, 232, 0.7)
        );

      border: 1px solid rgba(255, 255, 255, 0.95);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.07),
        inset 0 1px 0 #ffffff;

      font-size: 25px;
    }

    h1 {
      margin: 0;

      font-size: 31px;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 9px 0 24px;

      color: #777;
      font-size: 14px;
      line-height: 1.45;
    }

    /* ==============================
       FORM
    ============================== */

    .field {
      margin-bottom: 15px;
    }

    .label {
      display: block;
      margin: 0 0 7px 2px;

      color: #666;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    input,
    select {
      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid rgba(0, 0, 0, 0.075);
      border-radius: 17px;

      outline: none;

      color: var(--black);
      background: rgba(255, 255, 255, 0.72);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 5px 15px rgba(0, 0, 0, 0.025);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: rgba(0, 245, 0, 0.45);

      background: rgba(255, 255, 255, 0.95);

      box-shadow:
        0 0 0 4px rgba(0, 245, 0, 0.08),
        inset 0 1px 0 white;
    }

    input::placeholder {
      color: #aaa;
    }

    select {
      cursor: pointer;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ==============================
       CREATE BUTTON
    ============================== */

    .create-btn {
      width: 100%;
      height: 56px;

      margin-top: 5px;

      border: 0;
      border-radius: 19px;

      cursor: pointer;

      color: white;
      background: var(--black);

      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.06em;

      box-shadow:
        0 13px 28px rgba(0, 0, 0, 0.17),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .create-btn:hover {
      transform: translateY(-1px);
    }

    .create-btn:active {
      transform: translateY(1px);
    }

    .create-btn:disabled {
      cursor: wait;
      opacity: 0.55;
      transform: none;
    }

    /* ==============================
       MESSAGE
    ============================== */

    .message {
      display: none;

      margin-top: 14px;
      padding: 13px 15px;

      border-radius: 15px;

      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .message.success {
      display: block;

      color: #0c690c;

      border: 1px solid rgba(0, 245, 0, 0.15);
      background: rgba(0, 245, 0, 0.08);
    }

    .message.error {
      display: block;

      color: #a52a2f;

      border: 1px solid rgba(229, 72, 77, 0.13);
      background: rgba(229, 72, 77, 0.07);
    }

    /* ==============================
       REMINDERS
    ============================== */

    .section {
      margin-top: 28px;
      padding-top: 23px;

      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 13px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.09em;
    }

    .count-pill {
      min-width: 28px;

      padding: 5px 9px;

      border-radius: 999px;

      text-align: center;

      color: #333;
      background: rgba(0, 245, 0, 0.12);

      font-size: 10px;
      font-weight: 850;
    }

    .reminders {
      display: grid;
      gap: 9px;
    }

    .reminder {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 13px;
      align-items: center;

      padding: 14px;

      border: 1px solid rgba(0, 0, 0, 0.055);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.55);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .person {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 5px;

      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.04em;
    }

    .person::before {
      content: "";
      width: 6px;
      height: 6px;

      border-radius: 50%;
      background: var(--green);

      box-shadow: 0 0 8px rgba(0, 245, 0, 0.4);
    }

    .reminder-text {
      margin-bottom: 6px;

      font-size: 13px;
      font-weight: 650;
      line-height: 1.35;
    }

    .reminder-date {
      color: var(--gray);

      font-size: 10px;
      font-weight: 700;
    }

    .delete-btn {
      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 12px;

      cursor: pointer;

      color: #888;
      background: rgba(0, 0, 0, 0.045);

      font-size: 17px;

      transition:
        color 0.15s ease,
        background 0.15s ease,
        transform 0.15s ease;
    }

    .delete-btn:hover {
      color: #b3262c;
      background: rgba(229, 72, 77, 0.09);
    }

    .delete-btn:active {
      transform: scale(0.94);
    }

    /* ==============================
       EMPTY / LOADING
    ============================== */

    .empty {
      padding: 18px;

      border: 1px dashed rgba(0, 0, 0, 0.08);
      border-radius: 17px;

      text-align: center;

      color: #999;

      font-size: 11px;
      line-height: 1.5;
    }

    .loading {
      padding: 14px 0;

      text-align: center;

      color: #999;
      font-size: 11px;
    }

    /* ==============================
       FOOTER
    ============================== */

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      padding: 13px 6px 0;

      color: #aaa;

      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.07em;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 27px;
      }

      .subtitle {
        font-size: 13px;
      }

      .icon {
        width: 52px;
        height: 52px;
        border-radius: 17px;
        font-size: 22px;
      }

      .date-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      input,
      select {
        height: 50px;
      }

      .create-btn {
        height: 52px;
      }

      .reminder {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="widget">

    <div class="topbar">
      <div class="brand">
        DNK REMINDER
        <span class="green-dot"></span>
      </div>

      <div class="sync">
        <span class="sync-dot"></span>
        TELEGRAM
      </div>
    </div>

    <div class="card">

      <div class="icon">🔔</div>

      <h1>Нагадування</h1>

      <div class="subtitle">
        Нічого не тримай у голові — бот нагадає.
      </div>


      <!-- TASK -->

      <div class="field">
        <label class="label" for="task">
          ЩО НАГАДАТИ?
        </label>

        <input
          id="task"
          type="text"
          maxlength="300"
          placeholder="Наприклад: надіслати контент-план клієнту"
        />
      </div>


      <!-- PERSON -->

      <div class="field">
        <label class="label" for="person">
          КОМУ?
        </label>

        <select id="person">
          <option value="">
            Обери людину
          </option>

          <option value="anya_pm">
            Аня — Проджект-менеджер
          </option>

          <option value="nastya">
            Настя
          </option>

          <option value="yehor">
            Єгор
          </option>

          <option value="anya_target">
            Аня — Таргетолог
          </option>

          <option value="nadya">
            Надя
          </option>

          <option value="svitlana">
            Світлана
          </option>

          <option value="dasha">
            Даша
          </option>

          <option value="kyrylo">
            Кирило
          </option>
        </select>
      </div>


      <!-- DATE + TIME -->

      <div class="date-row">

        <div class="field">
          <label class="label" for="date">
            ДАТА
          </label>

          <input
            id="date"
            type="date"
          />
        </div>

        <div class="field">
          <label class="label" for="time">
            ЧАС
          </label>

          <input
            id="time"
            type="time"
          />
        </div>

      </div>


      <!-- CREATE -->

      <button
        id="createButton"
        class="create-btn"
        type="button"
      >
        СТВОРИТИ НАГАДУВАННЯ 🔔
      </button>

      <div
        id="message"
        class="message"
      ></div>


      <!-- ACTIVE REMINDERS -->

      <div class="section">

        <div class="section-head">

          <div class="section-title">
            АКТИВНІ НАГАДУВАННЯ
          </div>

          <div
            id="reminderCount"
            class="count-pill"
          >
            0
          </div>

        </div>

        <div
          id="reminders"
          class="reminders"
        >
          <div class="loading">
            Завантажуємо нагадування...
          </div>
        </div>

      </div>

    </div>


    <div class="footer">
      <span>DNK TOOLBOX</span>
      <span>EUROPE / KYIV</span>
    </div>

  </div>


  <script>

    /* ==========================================
       WORKER
    ========================================== */

    const API =
      "https://dnk-reminder.mpg597hhyh.workers.dev";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const taskInput =
      document.getElementById("task");

    const personInput =
      document.getElementById("person");

    const dateInput =
      document.getElementById("date");

    const timeInput =
      document.getElementById("time");

    const createButton =
      document.getElementById("createButton");

    const messageBox =
      document.getElementById("message");

    const remindersBox =
      document.getElementById("reminders");

    const reminderCount =
      document.getElementById("reminderCount");


    /* ==========================================
       DEFAULT DATE
    ========================================== */

    function setDefaultDate() {
      const now = new Date();

      const formatter =
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone: "Europe/Kyiv",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }
        );

      const parts =
        formatter.formatToParts(now);

      const data = {};

      for (const part of parts) {
        if (part.type !== "literal") {
          data[part.type] = part.value;
        }
      }

      const today =
        `${data.year}-${data.month}-${data.day}`;

      dateInput.value = today;
      dateInput.min = today;
    }


    /* ==========================================
       MESSAGE
    ========================================== */

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className =
        `message ${type}`;

      clearTimeout(
        showMessage.timeout
      );

      showMessage.timeout =
        setTimeout(() => {
          messageBox.className = "message";
          messageBox.textContent = "";
        }, 4500);
    }


    /* ==========================================
       CREATE REMINDER
    ========================================== */

    async function createReminder() {

      const text =
        taskInput.value.trim();

      const personId =
        personInput.value;

      const date =
        dateInput.value;

      const time =
        timeInput.value;


      if (!text) {
        showMessage(
          "Напиши, що потрібно нагадати 👀",
          "error"
        );

        taskInput.focus();
        return;
      }


      if (!personId) {
        showMessage(
          "Обери, кому нагадати 👀",
          "error"
        );

        personInput.focus();
        return;
      }


      if (!date) {
        showMessage(
          "Обери дату нагадування 👀",
          "error"
        );

        dateInput.focus();
        return;
      }


      if (!time) {
        showMessage(
          "Обери час нагадування 👀",
          "error"
        );

        timeInput.focus();
        return;
      }


      createButton.disabled = true;
      createButton.textContent =
        "СТВОРЮЄМО...";


      try {

        const response =
          await fetch(
            `${API}/reminders`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body: JSON.stringify({
                text,
                personId,
                date,
                time,
              }),
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {
          throw new Error(
            data.error ||
            "Не вдалося створити нагадування."
          );
        }


        taskInput.value = "";
        personInput.value = "";
        timeInput.value = "";

        showMessage(
          "Готово 💚 Нагадування створено",
          "success"
        );


        await loadReminders();


      } catch (error) {

        showMessage(
          error.message ||
          "Щось пішло не так 😢",
          "error"
        );

      } finally {

        createButton.disabled = false;

        createButton.textContent =
          "СТВОРИТИ НАГАДУВАННЯ 🔔";

      }
    }


    /* ==========================================
       LOAD REMINDERS
    ========================================== */

    async function loadReminders() {

      try {

        const response =
          await fetch(
            `${API}/reminders`
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {
          throw new Error();
        }


        const reminders =
          data.reminders || [];


        reminderCount.textContent =
          reminders.length;


        if (!reminders.length) {

          remindersBox.innerHTML =
            `
              <div class="empty">
                Активних нагадувань поки немає 💚
              </div>
            `;

          return;
        }


        remindersBox.innerHTML =
          reminders
            .map(renderReminder)
            .join("");


      } catch (error) {

        remindersBox.innerHTML =
          `
            <div class="empty">
              Не вдалося завантажити нагадування 😢
            </div>
          `;

      }
    }


    /* ==========================================
       RENDER REMINDER
    ========================================== */

    function renderReminder(reminder) {

      const personName =
        escapeHtml(
          reminder.personName ||
          "Без імені"
        );

      const text =
        escapeHtml(
          reminder.text ||
          "Без тексту"
        );

      const date =
        reminder.date
          ? formatDate(reminder.date)
          : "Без дати";

      const time =
        reminder.time ||
        "Без часу";


      return `
        <div class="reminder">

          <div>

            <div class="person">
              ${personName}
            </div>

            <div class="reminder-text">
              ${text}
            </div>

            <div class="reminder-date">
              ${date} · ${escapeHtml(time)}
            </div>

          </div>

          <button
            class="delete-btn"
            type="button"
            title="Видалити нагадування"
            onclick="deleteReminder('${escapeJs(reminder.id)}')"
          >
            ×
          </button>

        </div>
      `;
    }


    /* ==========================================
       DELETE
    ========================================== */

    async function deleteReminder(id) {

      const confirmed =
        confirm(
          "Видалити це нагадування?"
        );


      if (!confirmed) {
        return;
      }


      try {

        const response =
          await fetch(
            `${API}/reminders/${encodeURIComponent(id)}`,
            {
              method: "DELETE",
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {
          throw new Error();
        }


        showMessage(
          "Нагадування видалено",
          "success"
        );


        await loadReminders();


      } catch (error) {

        showMessage(
          "Не вдалося видалити нагадування 😢",
          "error"
        );

      }
    }


    /* ==========================================
       DATE FORMAT
    ========================================== */

    function formatDate(value) {

      const parts =
        value.split("-");


      if (parts.length !== 3) {
        return value;
      }


      return (
        `${parts[2]}.${parts[1]}.${parts[0]}`
      );
    }


    /* ==========================================
       SECURITY
    ========================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeJs(value) {

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }


    /* ==========================================
       EVENTS
    ========================================== */

    createButton.addEventListener(
      "click",
      createReminder
    );


    taskInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {
          createReminder();
        }

      }
    );


    /* ==========================================
       START
    ========================================== */

    setDefaultDate();
    loadReminders();

  </script>

</body>
</html>
