<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNK Content Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
    }

    body {
      min-height: 100vh;
      padding: 18px;
      background:
        radial-gradient(circle at 10% 15%, rgba(0,245,0,.08), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(0,245,0,.05), transparent 28%),
        #f7f7f5;
    }

    .widget {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00f500;
      box-shadow: 0 0 15px rgba(0,245,0,.55);
      flex: 0 0 auto;
    }

    .sync {
      color: #8b8b8b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255,255,255,.68);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 20px 50px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      left: -130px;
      top: -150px;
      border-radius: 50%;
      background: rgba(0,245,0,.08);
      filter: blur(25px);
      pointer-events: none;
    }

    .project-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .logo-wrap {
      width: 92px;
      height: 70px;
      flex: 0 0 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 20px;
      background: rgba(255,255,255,.76);
      box-shadow:
        0 10px 25px rgba(0,0,0,.055),
        inset 0 1px 0 white;
    }

    .logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .eyebrow {
      margin-bottom: 5px;
      color: #909090;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 36px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .period {
      margin-top: 8px;
      color: #777;
      font-size: 13px;
      font-weight: 600;
    }

    .notice {
      position: relative;
      z-index: 1;
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,245,0,.08);
      box-shadow: inset 0 0 0 1px rgba(0,245,0,.12);
      font-size: 13px;
      line-height: 1.4;
      font-weight: 750;
    }

    .notice.show {
      display: block;
    }

    .counter-box {
      position: relative;
      z-index: 1;
      padding: 25px;
      border-radius: 25px;
      background: rgba(255,255,255,.65);
      box-shadow:
        0 14px 35px rgba(0,0,0,.055),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    .counter-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .counter-label {
      color: #8c8c8c;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .number {
      margin-top: 4px;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: 950;
      line-height: .95;
      letter-spacing: -.065em;
    }

    .number span {
      color: #9a9a9a;
      font-size: .48em;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .percent {
      padding-bottom: 5px;
      color: #777;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0,0,0,.07);
      box-shadow: inset 0 2px 5px rgba(0,0,0,.05);
    }

    .fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #00f500;
      box-shadow: 0 0 15px rgba(0,245,0,.35);
      transition: width .35s ease;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: #8c8c8c;
      font-size: 11px;
      font-weight: 800;
    }

    .controls {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 19px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      transition:
        transform .15s ease,
        opacity .15s ease,
        box-shadow .15s ease;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .35;
    }

    .minus {
      background: rgba(255,255,255,.72);
      color: #111;
      box-shadow:
        0 10px 25px rgba(0,0,0,.055),
        inset 0 1px 0 white;
    }

    .plus {
      background: #111;
      color: white;
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
    }

    .plus:hover {
      box-shadow: 0 14px 32px rgba(0,0,0,.19);
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      color: #929292;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 15px;
      background: rgba(255,70,70,.08);
      color: #b42318;
      font-size: 12px;
      font-weight: 700;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 20px;
        border-radius: 25px;
      }

      .project-head {
        gap: 13px;
      }

      .logo-wrap {
        width: 74px;
        height: 58px;
        flex-basis: 74px;
        border-radius: 16px;
      }

      .counter-box {
        padding: 20px;
      }

      .counter-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .percent {
        padding-bottom: 0;
      }
    }
  </style>
</head>

<body>

  <main class="widget">

    <div class="topbar">
      <div class="brand">
        <span>КОНТЕНТ-ПЛАН</span>
        <span class="live-dot"></span>
      </div>

      <div class="sync" id="syncStatus">
        ПІДКЛЮЧЕННЯ…
      </div>
    </div>

    <section class="card">

      <div class="project-head">
        <div class="logo-wrap">
          <img class="logo" id="projectLogo" alt="">
        </div>

        <div>
          <div class="eyebrow">КІЛЬКІСТЬ ДОПИСІВ</div>
          <h1 id="projectName">Проєкт</h1>
          <div class="period" id="periodText"></div>
        </div>
      </div>

      <div class="notice" id="reportNotice"></div>

      <div class="counter-box">

        <div class="counter-top">
          <div>
            <div class="counter-label">ОПУБЛІКОВАНО</div>

            <div class="number">
              <span id="currentCountMain" style="font-size:1em;color:#111;font-weight:950;">0</span>
              <span id="limitText"> / 15</span>
            </div>
          </div>

          <div class="percent" id="percentText">
            0% виконано
          </div>
        </div>

        <div class="track">
          <div class="fill" id="progressFill"></div>
        </div>

        <div class="status-line">
          <span id="remainingText">Залишилось 15</span>
          <span id="goalStatus">ПОЧИНАЄМО</span>
        </div>

      </div>

      <div class="controls">
        <button class="minus" id="minusButton">− 1 ДОПИС</button>
        <button class="plus" id="plusButton">+ 1 ДОПИС</button>
      </div>

      <div class="footer">
        <span id="reportDateText"></span>
        <span id="periodKeyText"></span>
      </div>

      <div class="error" id="errorBox"></div>

    </section>

  </main>


  <script type="module">

    /* =========================================================
       FIREBASE
    ========================================================= */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      runTransaction,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyArvN4PkhrXrLwehOE9mrzO_IDKmpYoGu4",
      authDomain: "anya-80fd6.firebaseapp.com",
      projectId: "anya-80fd6",
      storageBucket: "anya-80fd6.firebasestorage.app",
      messagingSenderId: "457102538038",
      appId: "1:457102538038:web:2665c576a846cc9b7c2f97",
      measurementId: "G-228WKNGZEE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* =========================================================
       PROJECTS
    ========================================================= */

    const PROJECTS = {

      amtex: {
        name: "AMTEX",
        limit: 15,
        startDay: 18,
        reportDay: 17,
        logo: "amtex-logo.png.svg"
      },

      dnk: {
        name: "DNK AGENCY",
        limit: 15,
        startDay: 5,
        reportDay: 4,
        logo: "dnk-logo.png"
      },

      redefine: {
        name: "REDEFINE",
        limit: 15,
        startDay: 1,
        reportDay: 1,
        logo: "redefine-logo.png"
      },

      orising: {
        name: "ORISING",
        limit: 15,
        startDay: 5,
        reportDay: 4,
        logo: "orising-logo.png"
      },

      epilax: {
        name: "EPILAX",
        limit: 12,
        startDay: 11,
        reportDay: 10,
        logo: "epilax-logo.png"
      },

      duso_consulting: {
        name: "DUSO CONSULTING",
        limit: 8,
        startDay: 1,
        reportDay: 1,
        logo: "duso-consulting-logo.png"
      },

      icoone: {
        name: "ICOONE",
        limit: 10,
        startDay: 1,
        reportDay: 1,
        logo: "icoone-logo.png"
      },

      endymed: {
        name: "ENDYMED",
        limit: 10,
        startDay: 1,
        reportDay: 1,
        logo: "endymed-logo.png"
      },

      duso: {
        name: "DUSO",
        limit: 22,
        startDay: 1,
        reportDay: 1,
        logo: "duso-logo.png"
      },

      carp_pro: {
        name: "CARP PRO",
        limit: 22,
        startDay: 1,
        reportDay: 1,
        logo: "carp-pro-logo.png"
      },

      azura: {
        name: "AZURA",
        limit: 22,
        startDay: 1,
        reportDay: 1,
        logo: "azura-logo.png"
      },

      aerodrom: {
        name: "AERODROM",
        limit: 22,
        startDay: 1,
        reportDay: 1,
        logo: "aerodrom-logo.png"
      }

    };


    /* =========================================================
       PROJECT FROM URL
    ========================================================= */

    const params = new URLSearchParams(window.location.search);

    const requestedProject =
      (params.get("project") || "amtex")
        .trim()
        .toLowerCase();

    const projectKey =
      PROJECTS[requestedProject]
        ? requestedProject
        : "amtex";

    const project = PROJECTS[projectKey];


    /* =========================================================
       DATE HELPERS
    ========================================================= */

    const pad = n => String(n).padStart(2, "0");

    function daysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function formatDate(date) {
      return `${pad(date.getDate())}.${pad(date.getMonth() + 1)}.${date.getFullYear()}`;
    }

    function makeDate(year, monthIndex, day) {
      return new Date(year, monthIndex, day, 12, 0, 0, 0);
    }

    function addMonths(year, monthIndex, amount) {
      const d = new Date(year, monthIndex + amount, 1, 12, 0, 0, 0);

      return {
        year: d.getFullYear(),
        month: d.getMonth()
      };
    }


    /* =========================================================
       CURRENT PERIOD
    ========================================================= */

    function getCurrentPeriod(config) {

      const now = new Date();

      const year = now.getFullYear();
      const month = now.getMonth();
      const day = now.getDate();


      /*
        Calendar-month projects:
        01 → last day of the same month.
      */

      if (config.startDay === 1) {

        const start =
          makeDate(year, month, 1);

        const end =
          makeDate(
            year,
            month,
            daysInMonth(year, month)
          );

        const key =
          `${year}-${pad(month + 1)}`;

        return {
          start,
          end,
          key
        };
      }


      /*
        Shifted projects:
        Example AMTEX:
        18.10 → 17.11

        Example EPILAX:
        11.10 → 10.11
      */

      let startYear;
      let startMonth;

      if (day >= config.startDay) {
        startYear = year;
        startMonth = month;
      } else {
        const prev =
          addMonths(year, month, -1);

        startYear = prev.year;
        startMonth = prev.month;
      }

      const next =
        addMonths(startYear, startMonth, 1);

      const start =
        makeDate(
          startYear,
          startMonth,
          config.startDay
        );

      const end =
        makeDate(
          next.year,
          next.month,
          config.startDay - 1
        );

      const key =
        `${startYear}-${pad(startMonth + 1)}-${pad(config.startDay)}`;

      return {
        start,
        end,
        key
      };
    }


    const period =
      getCurrentPeriod(project);


    /* =========================================================
       REPORT DATE + REMINDER
    ========================================================= */

    function getReportDate(config, currentPeriod) {

      /*
        For projects with calendar month:
        report for previous month is handed in on
        the 1st of the new month.

        The new counter ALSO begins on that same 1st.
      */

      if (config.startDay === 1) {

        const next =
          addMonths(
            currentPeriod.start.getFullYear(),
            currentPeriod.start.getMonth(),
            1
          );

        return makeDate(
          next.year,
          next.month,
          1
        );
      }


      /*
        Shifted projects:
        report date = final day of current period.
      */

      return new Date(
        currentPeriod.end.getFullYear(),
        currentPeriod.end.getMonth(),
        currentPeriod.end.getDate(),
        12, 0, 0, 0
      );
    }


    const reportDate =
      getReportDate(project, period);


    function calendarDifference(a, b) {

      const one =
        new Date(
          a.getFullYear(),
          a.getMonth(),
          a.getDate()
        );

      const two =
        new Date(
          b.getFullYear(),
          b.getMonth(),
          b.getDate()
        );

      return Math.round(
        (two - one) / 86400000
      );
    }


    function renderReportReminder() {

      const box =
        document.getElementById("reportNotice");

      const now =
        new Date();

      const days =
        calendarDifference(
          now,
          reportDate
        );


      if (days === 2) {

        box.innerHTML =
          `📊 <strong>Через 2 дні звіт.</strong> Час починати збирати результати за період.`;

        box.classList.add("show");
        return;
      }


      if (days === 1) {

        box.innerHTML =
          `📊 <strong>Завтра звіт.</strong> Перевір, чи все готово до здачі.`;

        box.classList.add("show");
        return;
      }


      if (days === 0) {

        /*
          Special case:
          calendar projects begin a NEW period on
          the same date the previous report is delivered.
        */

        if (project.startDay === 1) {

          box.innerHTML =
            `📊 <strong>Сьогодні здаємо звіт за попередній місяць.</strong> Новий відлік дописів уже почався.`;

        } else {

          box.innerHTML =
            `📊 <strong>Сьогодні звіт.</strong> Перевір фінальну кількість дописів і результати за період.`;
        }

        box.classList.add("show");
        return;
      }


      box.classList.remove("show");
    }


    /* =========================================================
       UI
    ========================================================= */

    document.getElementById("projectName")
      .textContent = project.name;

    document.getElementById("projectLogo")
      .src = project.logo;

    document.getElementById("projectLogo")
      .alt = project.name;

    document.getElementById("periodText")
      .textContent =
        `${formatDate(period.start)} — ${formatDate(period.end)}`;

    document.getElementById("limitText")
      .textContent =
        ` / ${project.limit}`;

    document.getElementById("reportDateText")
      .textContent =
        `ЗВІТ: ${formatDate(reportDate)}`;

    document.getElementById("periodKeyText")
      .textContent =
        `ПЕРІОД ${period.key}`;

    renderReportReminder();


    /* =========================================================
       FIRESTORE DOCUMENT
    ========================================================= */

    /*
      Each period is a separate document.

      Example:
      counters/amtex_2026-10-18

      Therefore previous periods are NOT deleted.
    */

    const documentId =
      `${projectKey}_${period.key}`;

    const counterRef =
      doc(
        db,
        "counters",
        documentId
      );


    let currentCount = 0;
    let isBusy = false;


    /* =========================================================
       RENDER COUNTER
    ========================================================= */

    function renderCounter(value) {

      currentCount =
        Math.max(
          0,
          Math.min(
            project.limit,
            Number(value) || 0
          )
        );

      const percentage =
        project.limit > 0
          ? Math.round(
              (currentCount / project.limit) * 100
            )
          : 0;

      const remaining =
        Math.max(
          project.limit - currentCount,
          0
        );


      document
        .getElementById("currentCountMain")
        .textContent =
          currentCount;

      document
        .getElementById("percentText")
        .textContent =
          `${percentage}% виконано`;

      document
        .getElementById("progressFill")
        .style.width =
          `${percentage}%`;


      const remainingText =
        document.getElementById("remainingText");

      const status =
        document.getElementById("goalStatus");


      if (currentCount >= project.limit) {

        remainingText.textContent =
          "План закрито ✓";

        status.textContent =
          "ГОТОВО 🔥";

      } else {

        remainingText.textContent =
          `Залишилось ${remaining}`;

        if (percentage === 0) {

          status.textContent =
            "ПОЧИНАЄМО";

        } else if (percentage < 40) {

          status.textContent =
            "НАБИРАЄМО ТЕМП";

        } else if (percentage < 75) {

          status.textContent =
            "В ПРОЦЕСІ";

        } else {

          status.textContent =
            "ФІНІШНА ПРЯМА";
        }
      }


      document
        .getElementById("minusButton")
        .disabled =
          currentCount <= 0 || isBusy;

      document
        .getElementById("plusButton")
        .disabled =
          currentCount >= project.limit || isBusy;
    }


    /* =========================================================
       INITIAL DOCUMENT
    ========================================================= */

    async function ensureDocument() {

      try {

        await setDoc(
          counterRef,
          {
            project: projectKey,
            projectName: project.name,
            periodKey: period.key,
            periodStart: formatDate(period.start),
            periodEnd: formatDate(period.end),
            limit: project.limit
          },
          {
            merge: true
          }
        );

      } catch (error) {

        console.error(error);

        showError(
          "Не вдалося підключитися до спільного лічильника."
        );
      }
    }


    /* =========================================================
       LIVE SYNC
    ========================================================= */

    onSnapshot(
      counterRef,

      snapshot => {

        document
          .getElementById("syncStatus")
          .textContent =
            "СИНХРОНІЗОВАНО";

        if (!snapshot.exists()) {

          renderCounter(0);
          return;
        }

        const data =
          snapshot.data();

        renderCounter(
          data.count ?? 0
        );
      },

      error => {

        console.error(error);

        document
          .getElementById("syncStatus")
          .textContent =
            "ПОМИЛКА";

        showError(
          "Немає доступу до Firebase. Перевір Firestore Rules."
        );
      }
    );


    /* =========================================================
       CHANGE COUNTER
    ========================================================= */

    async function changeCount(amount) {

      if (isBusy) return;

      isBusy = true;
      renderCounter(currentCount);

      try {

        await runTransaction(
          db,

          async transaction => {

            const snapshot =
              await transaction.get(counterRef);

            let oldCount = 0;

            if (snapshot.exists()) {

              oldCount =
                Number(
                  snapshot.data().count
                ) || 0;
            }

            const newCount =
              Math.max(
                0,
                Math.min(
                  project.limit,
                  oldCount + amount
                )
              );

            transaction.set(
              counterRef,
              {
                project: projectKey,
                projectName: project.name,

                count: newCount,
                limit: project.limit,

                periodKey: period.key,
                periodStart:
                  formatDate(period.start),

                periodEnd:
                  formatDate(period.end),

                updatedAt:
                  serverTimestamp()
              },
              {
                merge: true
              }
            );
          }
        );

      } catch (error) {

        console.error(error);

        showError(
          "Не вдалося зберегти зміну. Спробуй ще раз."
        );

      } finally {

        isBusy = false;
        renderCounter(currentCount);
      }
    }


    document
      .getElementById("plusButton")
      .addEventListener(
        "click",
        () => changeCount(1)
      );

    document
      .getElementById("minusButton")
      .addEventListener(
        "click",
        () => changeCount(-1)
      );


    /* =========================================================
       ERROR
    ========================================================= */

    function showError(message) {

      const box =
        document.getElementById("errorBox");

      box.textContent =
        message;

      box.classList.add("show");
    }


    /* =========================================================
       START
    ========================================================= */

    renderCounter(0);
    ensureDocument();

  </script>

</body>
</html>
